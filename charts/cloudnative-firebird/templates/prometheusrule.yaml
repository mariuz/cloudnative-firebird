{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-firebird
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudnative-firebird.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
{{ .Files.Get "files/firebird.rules.yaml" | indent 2 }}
{{- end }}
