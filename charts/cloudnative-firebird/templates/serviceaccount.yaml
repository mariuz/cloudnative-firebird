apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudnative-firebird-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudnative-firebird.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
