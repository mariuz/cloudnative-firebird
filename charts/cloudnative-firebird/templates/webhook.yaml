{{- if .Values.webhook.enabled }}
# Validating admission webhook served by the operator (port 9443). The operator creates its
# certificates (Secret cloudnative-firebird-webhook-cert) and fills in caBundle below; until it
# has, and whenever the operator is unavailable, objects are admitted (failurePolicy: Ignore) and
# the operator still validates them when it reconciles.
apiVersion: v1
kind: Service
metadata:
  name: cloudnative-firebird-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudnative-firebird.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cloudnative-firebird.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: cloudnative-firebird-validating-webhook
  labels:
    {{- include "cloudnative-firebird.labels" . | nindent 4 }}
webhooks:
  - name: validate.firebird.cloudnative-firebird.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    clientConfig:
      service:
        name: cloudnative-firebird-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
    rules:
      - apiGroups: ["firebird.cloudnative-firebird.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources:
          - firebirdclusters
          - firebirdbackups
          - firebirdscheduledbackups
          - firebirdrestores
          - firebirdusers
          - firebirdroles
          - firebirddatabases
        scope: Namespaced
{{- end }}
