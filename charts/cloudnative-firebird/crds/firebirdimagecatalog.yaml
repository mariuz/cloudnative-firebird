apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firebirdimagecatalogs.firebird.cloudnative-firebird.io
spec:
  group: firebird.cloudnative-firebird.io
  names:
    kind: FirebirdImageCatalog
    listKind: FirebirdImageCatalogList
    plural: firebirdimagecatalogs
    singular: firebirdimagecatalog
    shortNames:
      - fbic
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            The Firebird image of each major version (after CloudNativePG's ImageCatalog), for
            clusters that reference it with spec.imageCatalogRef instead of naming an image.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - images
              properties:
                images:
                  description: One image per Firebird major version
                  type: array
                  minItems: 1
                  maxItems: 20
                  x-kubernetes-validations:
                    - rule: "self.all(a, self.exists_one(b, b.major == a.major))"
                      message: each major version is listed once
                  items:
                    type: object
                    required:
                      - major
                      - image
                    properties:
                      major:
                        description: Firebird major version (e.g. 5)
                        type: integer
                        minimum: 1
                        maximum: 99
                      image:
                        description: Image of that major version (e.g. firebirdsql/firebird:5.0.3)
                        type: string
                        minLength: 1
                        maxLength: 512
                        pattern: '^\S+$'
