name: Firebird formats

# The operator writes two Firebird-internal formats itself: the replica control file
# (fb-agent replica-control) and the HDR_repl_seq header clump (fb-agent set-repl-seq). This checks them
# against each image's own engine and replica server (hack/firebird-formats): on changes to them,
# weekly (a new Firebird 6 snapshot may change a format), and on demand for any image.
on:
  pull_request:
    branches: ["main"]
    paths:
      - "operator/agent/**"
      - "hack/firebird-formats/**"
      - ".github/workflows/firebird-formats.yaml"
  push:
    branches: ["main"]
    paths:
      - "operator/agent/**"
      - "hack/firebird-formats/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      image:
        description: "Firebird image to check (e.g. firebirdsql/firebird:6)"
        required: true

permissions:
  contents: read

jobs:
  formats:
    name: Firebird formats (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.image)) || fromJSON('["firebirdsql/firebird:4", "firebirdsql/firebird:5", "firebirdsql/firebird:6-snapshot"]') }}
    # a development build: on pull requests its failures are reported without failing the workflow
    continue-on-error: ${{ github.event_name == 'pull_request' && contains(matrix.image, 'snapshot') }}
    steps:
      - uses: actions/checkout@v4

      # the agent's static binary, as the operator image carries it (the toolchain of
      # operator/agent/rust-toolchain.toml, installed by rustup on first use)
      - name: Build the agent
        working-directory: operator/agent
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          # the C and assembly parts of the TLS library (ring), for the static musl target
          CC_x86_64_unknown_linux_musl: clang
          CFLAGS_x86_64_unknown_linux_musl: --target=x86_64-unknown-linux-musl
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl
          target/x86_64-unknown-linux-musl/release/fb-agent version

      - name: Check the formats against ${{ matrix.image }}
        run: hack/firebird-formats/verify.sh "${{ matrix.image }}"
