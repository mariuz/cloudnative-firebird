name: Release

# Publishes the operator image, ghcr.io/mariuz/cloudnative-firebird (linux/amd64 and arm64), once
# CI passed on a push to main: :latest and :sha-<commit> every time, and :<version> plus the git
# tag v<version> and a GitHub Release with the install manifest (hack/release/bundle.sh) when the
# operator's version (PLUGIN_VERSION in operator/src/plugin/cli.ts, the tag
# config/deploy/deployment.yaml deploys; hack/release/version.sh) has no tag yet. A version is
# never built twice: bump it to publish a new one. The Release also carries the Helm chart
# (charts/cloudnative-firebird), pushed to oci://ghcr.io/<owner>/charts as well. Pull requests only
# build the image, the manifest and the chart. Run on demand for a tag or main to publish its
# version again (a failed push), latest, the Release's assets and the chart included.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "operator/**"
      - "config/crds/**"
      - "config/deploy/**"
      - "charts/**"
      - "hack/release/**"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mariuz/cloudnative-firebird

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Operator image
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version="$(hack/release/version.sh)"
          publish=false; version_tag=false; git_tag=false
          if [ "$EVENT" != pull_request ]; then
            publish=true
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              if [ "$EVENT" = workflow_dispatch ]; then
                version_tag=true
                echo "v$version is tagged already: publishing $IMAGE:$version again"
              else
                echo "v$version is tagged already: publishing latest only (bump PLUGIN_VERSION for a new version)"
              fi
            else
              version_tag=true; git_tag=true
            fi
          fi
          echo "operator version $version (publish=$publish, version tag=$version_tag, git tag=$git_tag)"
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "version_tag=$version_tag"
            echo "git_tag=$git_tag"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.publish }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version_tag }}
            type=sha
          labels: |
            org.opencontainers.image.title=cloudnative-firebird
            org.opencontainers.image.description=Kubernetes operator for Firebird
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build${{ steps.version.outputs.publish == 'true' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: operator
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.version.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # no attestation manifests: they list as unknown/unknown platforms
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag v${{ steps.version.outputs.version }}
        if: steps.version.outputs.git_tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "cloudnative-firebird v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Install manifest
        id: bundle
        run: echo "file=$(hack/release/bundle.sh)" >> "$GITHUB_OUTPUT"

      - name: Helm chart
        id: chart
        run: |
          hack/release/chart.sh check
          echo "file=$(hack/release/chart.sh package)" >> "$GITHUB_OUTPUT"

      - name: Push the chart to oci://ghcr.io/${{ github.repository_owner }}/charts
        if: steps.version.outputs.version_tag == 'true'
        env:
          FILE: ${{ steps.chart.outputs.file }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "$FILE" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Release v${{ steps.version.outputs.version }}
        if: steps.version.outputs.version_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          FILE: ${{ steps.bundle.outputs.file }}
          CHART: ${{ steps.chart.outputs.file }}
        run: |
          # the versioned manifest, and the same under a fixed name for releases/latest/download
          cp "$FILE" cloudnative-firebird.yaml
          # the notes: what changed (the version's ROADMAP.md entry), the image, how to install
          {
            echo "## What changed"
            echo
            hack/release/notes.sh "$VERSION"
            echo
            echo "## Install or upgrade"
            echo
            echo "Operator image: \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64${DIGEST:+; \`$DIGEST\`})."
            echo
            echo "The CRDs and the operator, in one manifest:"
            echo
            echo '```bash'
            echo "kubectl apply -f https://github.com/${{ github.repository }}/releases/download/v$VERSION/$FILE"
            echo '```'
            echo
            echo "Or with Helm (the chart, \`$(basename "$CHART")\`, is also pushed to \`oci://ghcr.io/${{ github.repository_owner }}/charts/cloudnative-firebird\`):"
            echo
            echo '```bash'
            echo "helm install cloudnative-firebird oci://ghcr.io/${{ github.repository_owner }}/charts/cloudnative-firebird --version $VERSION -n cloudnative-firebird-system --create-namespace"
            echo '```'
            echo
            echo "Upgrading: [README](https://github.com/${{ github.repository }}/blob/v$VERSION/README.md#upgrading-the-operator); the whole roadmap: [ROADMAP.md](https://github.com/${{ github.repository }}/blob/v$VERSION/ROADMAP.md)."
          } > release-notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$FILE" cloudnative-firebird.yaml "$CHART" --clobber
            gh release edit "v$VERSION" --notes-file release-notes.md
          else
            gh release create "v$VERSION" "$FILE" cloudnative-firebird.yaml "$CHART" --title "v$VERSION" --notes-file release-notes.md
          fi

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PUBLISH: ${{ steps.version.outputs.publish }}
          GIT_TAG: ${{ steps.version.outputs.git_tag }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE: ${{ steps.bundle.outputs.file }}
          CHART: ${{ steps.chart.outputs.file }}
        run: |
          {
            if [ "$PUBLISH" = true ]; then echo "Published:"; else echo "Built (not published):"; fi
            echo
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
            echo "- \`$FILE\` ($(wc -c < "$FILE") bytes)"
            echo "- \`$CHART\` (the Helm chart)"
            [ "$GIT_TAG" = true ] && echo && echo "Tagged \`v$VERSION\`."
            [ "$VERSION_TAG" = true ] && echo && echo "Release v$VERSION: https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
            true
          } >> "$GITHUB_STEP_SUMMARY"
