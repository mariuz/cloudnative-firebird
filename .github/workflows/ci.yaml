name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: operator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --coverage

  integration-tests:
    # one run per Firebird version: the operator's FIREBIRD_DEFAULT_IMAGE (unset: latest, Firebird 5)
    # applies to every cluster below; only the major upgrade check sets spec.imageName
    name: Integration Tests (kind${{ matrix.firebird.suffix }}${{ matrix.track.suffix }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        firebird:
          - { suffix: "", image: "" }
          - { suffix: ", Firebird 4", image: "firebirdsql/firebird:4" }
          # a development build: its failures are reported but do not fail the workflow
          - { suffix: ", Firebird 6 snapshot", image: "firebirdsql/firebird:6-snapshot", experimental: true }
        # two tracks per image, each on its own kind cluster, to halve the wall time: "core" runs the
        # replicated cluster's lifecycle (switchover, failover, rolling updates, backups, users),
        # "extended" the other clusters (segment TLS, synchronous replication, enabling replication
        # later, paused reconciliation, fencing of a clone). Steps without a track run in both.
        track:
          - { id: core, suffix: "" }
          - { id: extended, suffix: ", extended" }
    continue-on-error: ${{ matrix.firebird.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: operator/package-lock.json

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: firebird-test

      - name: Build operator image
        run: |
          cd operator
          npm ci
          # Docker Hub rate limits and outages (429, 504 on the base image) fail the build before
          # any test runs: try again a few times
          for attempt in 1 2 3 4; do
            docker build -t cloudnative-firebird:ci . && break
            [ "$attempt" = 4 ] && exit 1
            echo "build attempt $attempt failed; retrying in 30s"; sleep 30
          done

      - name: Load operator image into kind
        run: kind load docker-image cloudnative-firebird:ci --name firebird-test

      - name: Install CRDs
        run: kubectl apply -f config/crds/

      - name: Verify CRD admission rules
        run: hack/crd-validation/test.sh

      - name: Deploy operator
        run: |
          kubectl apply -f config/deploy/namespace.yaml
          kubectl apply -f config/deploy/serviceaccount.yaml
          kubectl apply -f config/deploy/rbac.yaml
          kubectl apply -f config/deploy/webhook.yaml
          # Patch deployment to use the locally built image and avoid pulling from registry
          sed 's|image: ghcr.io/mariuz/cloudnative-firebird:latest|image: cloudnative-firebird:ci|;s|imagePullPolicy: Always|imagePullPolicy: Never|' \
            config/deploy/deployment.yaml | kubectl apply -f -
          # a short resync: the waits below move on at the next reconcile
          kubectl set env deployment/cloudnative-firebird-operator -n cloudnative-firebird-system \
            RESYNC_INTERVAL_SECONDS=10 FIREBIRD_DEFAULT_IMAGE="${{ matrix.firebird.image }}"

      - name: Wait for operator to be ready
        run: |
          kubectl rollout status deployment/cloudnative-firebird-operator \
            -n cloudnative-firebird-system --timeout=120s

      - name: Enforce the baseline Pod Security Standard
        run: |
          # every instance pod and Job created from here on must pass baseline admission
          kubectl label namespace default pod-security.kubernetes.io/enforce=baseline pod-security.kubernetes.io/warn=restricted

      - name: Create FirebirdCluster
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdCluster
          metadata:
            name: test-cluster
            namespace: default
          spec:
            instances: 1
            storage:
              size: 1Gi
          EOF

      - name: Wait for StatefulSet to be created
        run: |
          timeout 60 bash -c \
            'until kubectl get statefulset test-cluster -n default 2>/dev/null; do sleep 3; done'

      - name: Verify Services are created
        run: |
          timeout 60 bash -c \
            'until kubectl get service test-cluster -n default 2>/dev/null; do sleep 3; done'
          timeout 60 bash -c \
            'until kubectl get service test-cluster-headless -n default 2>/dev/null; do sleep 3; done'

      - name: Verify Lease and status are reconciled
        run: |
          timeout 60 bash -c \
            'until kubectl get lease test-cluster-lease -n default 2>/dev/null; do sleep 3; done'
          timeout 60 bash -c \
            'until [ -n "$(kubectl get firebirdcluster test-cluster -o jsonpath={.status.phase})" ]; do sleep 3; done'
          kubectl get firebirdcluster test-cluster -o jsonpath='{.status}'; echo

      - name: Verify segment TLS is on by default for new clusters
        run: |
          # kind runs Kubernetes 1.29 or later: the operator defaults new clusters to segment TLS
          kubectl logs -n cloudnative-firebird-system -l app.kubernetes.io/name=cloudnative-firebird --tail=-1 \
            | grep 'Segment TLS default for new clusters' | tee /dev/stderr | grep -q '"segmentTlsDefault":true'
          timeout 60 bash -c 'until [ -n "$(kubectl get firebirdcluster test-cluster -o jsonpath={.spec.segmentTLS.enabled})" ]; do sleep 2; done'
          [ "$(kubectl get firebirdcluster test-cluster -o jsonpath={.spec.segmentTLS.enabled})" = true ]
          kubectl get events --field-selector reason=SegmentTLSDefaulted,involvedObject.name=test-cluster -o name | grep -q .
          kubectl get secret test-cluster-segment-tls >/dev/null
          timeout 120 bash -c 'until kubectl get pod test-cluster-0 >/dev/null 2>&1; do sleep 3; done'
          [ "$(kubectl get pod test-cluster-0 -o jsonpath='{.spec.initContainers[0].name}')" = segment-tls ]
          # the backup file server behind it listens on localhost only
          kubectl wait pod/test-cluster-0 --for=condition=Ready --timeout=300s
          kubectl logs test-cluster-0 -c backup-files | grep -q 'listening on 127.0.0.1:3061'
          # and records that the primary will hold its Lease once automatic failover is on (v0.87.0)
          kubectl logs -n cloudnative-firebird-system -l app.kubernetes.io/name=cloudnative-firebird --tail=-1 \
            | grep 'Primary Lease default' | tee /dev/stderr | grep -q '"primaryLeaseDefault":true'
          [ "$(kubectl get firebirdcluster test-cluster -o jsonpath='{.metadata.annotations.firebird\.cloudnative-firebird\.io/primary-lease}')" = enabled ]
          kubectl get events --field-selector reason=PrimaryLeaseDefaulted,involvedObject.name=test-cluster -o name | grep -q .

      - name: Verify the admission webhook
        run: |
          # the operator writes its certificates and fills in the caBundle
          timeout 120 bash -c "until [ -n \"\$(kubectl get validatingwebhookconfiguration cloudnative-firebird-validating-webhook -o jsonpath='{.webhooks[0].clientConfig.caBundle}')\" ]; do sleep 3; done"
          kubectl get secret cloudnative-firebird-webhook-cert -n cloudnative-firebird-system -o jsonpath='{.type}' | grep -q kubernetes.io/tls
          restore() { # <file> <spec lines after clusterName>
            printf 'apiVersion: firebird.cloudnative-firebird.io/v1\nkind: FirebirdRestore\nmetadata:\n  name: webhook-check\n  namespace: default\nspec:\n  clusterName: test-cluster\n%s\n' "$2" > "$1"
          }
          restore /tmp/over.yaml '  backupPath: x.fbk
            targetDatabase: mydb.fdb'
          restore /tmp/missing.yaml '  backupName: no-such-backup'
          restore /tmp/valid.yaml '  backupPath: x.fbk'
          sed -i 's/^ *targetDatabase/  targetDatabase/' /tmp/over.yaml
          # a restore over the cluster database is refused (failurePolicy Ignore: retried until the
          # API server calls the webhook with the new caBundle)
          for i in $(seq 1 40); do
            out=$(kubectl apply --dry-run=server -f /tmp/over.yaml 2>&1 || true)
            echo "$out" | grep -q 'is the cluster database' && break
            sleep 3
          done
          echo "$out"
          echo "$out" | grep -q 'denied the request'
          # so is one from a backup that does not exist; a valid one is admitted
          out=$(kubectl apply --dry-run=server -f /tmp/missing.yaml 2>&1 || true); echo "$out"
          echo "$out" | grep -q 'FirebirdBackup no-such-backup not found'
          kubectl apply --dry-run=server -f /tmp/valid.yaml | grep -q 'server dry run'
          # a user whose password Secret does not exist yet is admitted, with a warning
          out=$(kubectl apply --dry-run=server -f - 2>&1 <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdUser
          metadata:
            name: webhook-check
            namespace: default
          spec:
            clusterName: test-cluster
            passwordSecret:
              name: no-such-secret
          EOF
          ); echo "$out"
          echo "$out" | grep -q 'Warning: Secret no-such-secret does not exist'
          echo "$out" | grep -q 'server dry run'

      - name: Verify the Firebird instance persists data on its PVC
        run: |
          wait_ready() {
            timeout 300 bash -c 'until kubectl get pod test-cluster-0 -n default >/dev/null 2>&1; do sleep 3; done'
            kubectl wait pod/test-cluster-0 -n default --for=condition=Ready --timeout=300s
          }
          wait_ready
          # The entrypoint created the cluster database on the PVC; ISC_USER/ISC_PASSWORD come from the pod env
          kubectl exec test-cluster-0 -- bash -c \
            'echo "create table ci_probe (id int); commit; insert into ci_probe values (1); commit;" | isql localhost:/var/lib/firebird/data/mydb.fdb'
          kubectl delete pod test-cluster-0 -n default --wait=true
          wait_ready
          kubectl exec test-cluster-0 -- bash -c \
            "echo \"select 'rows=' || count(*) from ci_probe;\" | isql localhost:/var/lib/firebird/data/mydb.fdb" | tee /tmp/probe.txt
          grep -q 'rows=1' /tmp/probe.txt

      - name: Verify the Firebird version under test
        run: |
          want="${{ matrix.firebird.image }}"
          want=${want:-firebirdsql/firebird:latest}
          image=$(kubectl get pod test-cluster-0 -o jsonpath='{.spec.containers[?(@.name=="firebird")].image}')
          echo "instance image: $image (expected $want)"
          [ "$image" = "$want" ]
          kubectl exec test-cluster-0 -c firebird -- sh -c 'isql -z </dev/null | head -n 1'

      - name: Verify spec updates are patched onto the StatefulSet
        run: |
          kubectl patch firebirdcluster test-cluster --type merge -p '{"spec":{"instances":2}}'
          timeout 90 bash -c \
            'until [ "$(kubectl get statefulset test-cluster -o jsonpath={.spec.replicas})" = "2" ]; do sleep 3; done'
          timeout 60 bash -c \
            'until kubectl get pdb test-cluster-pdb -n default 2>/dev/null; do sleep 3; done'

      - name: Verify declarative hibernation
        run: |
          kubectl patch firebirdcluster test-cluster --type merge -p '{"spec":{"hibernated":true}}'
          timeout 90 bash -c \
            'until [ "$(kubectl get statefulset test-cluster -o jsonpath={.spec.replicas})" = "0" ]; do sleep 3; done'
          timeout 90 bash -c \
            'until [ "$(kubectl get firebirdcluster test-cluster -o jsonpath={.status.phase})" = "Hibernated" ]; do sleep 3; done'
          timeout 60 bash -c \
            'while kubectl get pdb test-cluster-pdb -n default 2>/dev/null; do sleep 3; done'
          # PVCs must survive hibernation
          kubectl get pvc firebird-data-test-cluster-0 -n default

      - name: Verify resuming from hibernation
        run: |
          kubectl patch firebirdcluster test-cluster --type merge -p '{"spec":{"hibernated":false}}'
          timeout 90 bash -c \
            'until [ "$(kubectl get statefulset test-cluster -o jsonpath={.spec.replicas})" = "2" ]; do sleep 3; done'

      - name: Verify journal replication and seeding from a replica
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdCluster
          metadata:
            name: repl
            namespace: default
          spec:
            instances: 2
            storage:
              size: 1Gi
            bootstrap:
              initSql: "CREATE TABLE app (id INTEGER PRIMARY KEY, note VARCHAR(20)); COMMIT;"
            replication:
              enabled: true
              archiveTimeoutSeconds: 3
            # plain until the segment TLS step switches it on (new clusters default to TLS)
            segmentTLS:
              enabled: false
          EOF
          ready() {
            timeout 300 bash -c "until kubectl get pod $1 -n default >/dev/null 2>&1; do sleep 3; done"
            kubectl wait pod/$1 -n default --for=condition=Ready --timeout=300s
          }
          sql() { kubectl exec "$1" -c firebird -- bash -c "echo \"$2\" | isql -q localhost:$DB"; }
          count() { sql "$1" 'select count(*) from app;' | awk '$1 ~ /^[0-9]+$/ { print $1 }'; }
          wait_count() {
            for n in $(seq 1 36); do
              [ "$(count "$1")" = "$2" ] && return 0
              sleep 5
            done
            echo "$1 has $(count "$1") rows, expected $2"; return 1
          }
          ready repl-0
          ready repl-1
          kubectl logs repl-1 -c replication-init | tee /tmp/repl-1-init.log
          grep -q 'offline seed' /tmp/repl-1-init.log

          for i in $(seq 1 20); do sql repl-0 "insert into app values ($i, 'primary'); commit;"; done
          wait_count repl-1 20
          echo "replica applied 20 rows"

          # the operator measures the lag from the segment servers and publishes it
          timeout 120 bash -c 'until [ "$(kubectl get firebirdcluster repl -o jsonpath={.status.replicationStatus.replicas[0].lagSegments})" = 0 ]; do sleep 5; done' \
            || { kubectl get firebirdcluster repl -o jsonpath='{.status.replicationStatus}'; exit 1; }
          kubectl get firebirdcluster repl -o jsonpath='{.status.replicationStatus}'; echo
          [ "$(kubectl get firebirdcluster repl -o jsonpath={.status.replicationStatus.replicas[0].name})" = repl-1 ]
          [ -n "$(kubectl get firebirdcluster repl -o jsonpath={.status.replicationStatus.lastArchivedSequence})" ]
          [ "$(kubectl get pod repl-1 -o jsonpath='{.metadata.annotations.firebird\.cloudnative-firebird\.io/replication-lag-seconds}')" = 0 ]

          # ... and exports it on the operator's /metrics endpoint
          # the leader (Lease holder) reconciles and exports the cluster metrics
          OP=$(kubectl get lease cloudnative-firebird-operator -n cloudnative-firebird-system -o jsonpath={.spec.holderIdentity})
          kubectl get --raw "/api/v1/namespaces/cloudnative-firebird-system/pods/$OP:8080/proxy/metrics" | grep -q '^cloudnative_firebird_operator_leader 1$'
          kubectl get --raw "/api/v1/namespaces/cloudnative-firebird-system/pods/$OP:8080/proxy/metrics" | tee /tmp/metrics.txt | grep '^firebird_'
          grep -q '^firebird_replication_lag_seconds{namespace="default",cluster="repl",pod="repl-1"} 0$' /tmp/metrics.txt
          grep -q '^firebird_cluster_ready_instances{namespace="default",cluster="repl"} 2$' /tmp/metrics.txt
          grep -q '^firebird_operator_reconciles_total{namespace="default",cluster="repl",result="success"}' /tmp/metrics.txt

          # ... and tells the primary which archived segments the replica still needs
          timeout 120 bash -c 'until [ -n "$(kubectl get firebirdcluster repl -o jsonpath={.status.replicationStatus.segmentRetention.floorSequence})" ]; do sleep 5; done' \
            || { kubectl get firebirdcluster repl -o jsonpath='{.status.replicationStatus}'; exit 1; }
          kubectl exec repl-0 -c firebird -- cat /var/lib/firebird/data/replication/retain-floor | grep -Eq '^[0-9]+$'

          # replicas are read-only
          if sql repl-1 "insert into app values (999, 'replica'); commit;" 2>&1 | grep -q 'read-only'; then
            echo "replica rejects writes"
          else
            echo "replica accepted a write"; exit 1
          fi

          # the third instance is seeded from the ready replica, not from the primary
          timeout 180 bash -c "until kubectl get configmap repl-config -o yaml | grep -A2 'seed-sources:' | grep -q repl-1.repl-headless; do sleep 5; done"
          kubectl patch firebirdcluster repl --type merge -p '{"spec":{"instances":3}}'
          ready repl-2
          kubectl logs repl-2 -c replication-init | tee /tmp/repl-2-init.log
          grep -q 'from repl-1.repl-headless (replica seed)' /tmp/repl-2-init.log
          for i in $(seq 21 30); do sql repl-0 "insert into app values ($i, 'primary'); commit;"; done
          wait_count repl-2 30
          echo "replica seeded from a replica applied all 30 rows"

      - name: Verify backups and restores through the operator
        if: matrix.track.id == 'core'
        run: |
          DB_DIR=/var/lib/firebird/data
          wait_phase() {
            for n in $(seq 1 60); do
              phase=$(kubectl get "$1" "$2" -o jsonpath='{.status.phase}')
              [ "$phase" = "$3" ] && return 0
              [ "$phase" = "Failed" ] && break
              sleep 5
            done
            kubectl get "$1" "$2" -o yaml; kubectl logs "job/$4" --all-containers || true; return 1
          }
          count() {
            kubectl exec repl-0 -c firebird -- bash -c \
              "echo 'select count(*) from app;' | isql -q localhost:$DB_DIR/$1" | awk '$1 ~ /^[0-9]+$/ { print $1 }'
          }
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdBackup
          metadata:
            name: repl-logical
          spec:
            clusterName: repl
            verify: true
          ---
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdBackup
          metadata:
            name: repl-physical
          spec:
            clusterName: repl
            type: physical
            level: 0
          EOF
          wait_phase firebirdbackup repl-logical Completed backup-repl-logical
          # status.instance: the backup ran on the primary (the default target)
          [ "$(kubectl get firebirdbackup repl-logical -o jsonpath={.status.instance})" = repl-0 ]
          # verify: the backup was restored into a scratch database on the primary, validated and dropped
          [ "$(kubectl get firebirdbackup repl-logical -o jsonpath={.status.verified})" = true ]
          kubectl logs job/backup-repl-logical | grep -q 'restored and validated'
          if kubectl exec repl-0 -c firebird -- ls -a $DB_DIR | grep -q '^\.verify-'; then echo "scratch database left behind"; exit 1; fi
          wait_phase firebirdbackup repl-physical Completed backup-repl-physical
          kubectl get firebirdbackups

          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdRestore
          metadata:
            name: from-logical
          spec:
            clusterName: repl
            backupName: repl-logical
          ---
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdRestore
          metadata:
            name: from-physical
          spec:
            clusterName: repl
            restoreType: physical
            backupPath: nbackup-l0-repl-physical.nbk
          EOF
          wait_phase firebirdrestore from-logical Completed restore-from-logical
          wait_phase firebirdrestore from-physical Completed restore-from-physical
          [ "$(count restore-from-logical.fdb)" = "30" ]
          [ "$(count restore-from-physical.fdb)" = "30" ]
          echo "both restores contain all 30 rows"

          # restoring over the cluster database is refused: by the admission webhook when it is applied,
          # and by the operator for an object the webhook did not see (failurePolicy Ignore, e.g. the
          # operator was down): here the webhook skips objects labelled webhook-check=skip for a moment
          cat > /tmp/over-live.yaml <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdRestore
          metadata:
            name: over-live
            labels:
              webhook-check: skip
          spec:
            clusterName: repl
            backupName: repl-logical
            targetDatabase: mydb.fdb
          EOF
          out=$(kubectl apply -f /tmp/over-live.yaml 2>&1 || true); echo "$out"
          echo "$out" | grep -q 'denied the request: targetDatabase mydb.fdb is the cluster database'
          if kubectl get firebirdrestore over-live 2>/dev/null; then echo "over-live was admitted"; exit 1; fi
          kubectl patch validatingwebhookconfiguration cloudnative-firebird-validating-webhook --type=json \
            -p '[{"op":"add","path":"/webhooks/0/objectSelector","value":{"matchExpressions":[{"key":"webhook-check","operator":"NotIn","values":["skip"]}]}}]'
          for i in $(seq 1 20); do kubectl apply -f /tmp/over-live.yaml 2>/dev/null && break; sleep 3; done
          kubectl patch validatingwebhookconfiguration cloudnative-firebird-validating-webhook --type=json \
            -p '[{"op":"remove","path":"/webhooks/0/objectSelector"}]'
          wait_phase firebirdrestore over-live Failed restore-over-live
          kubectl get firebirdrestore over-live -o jsonpath='{.status.error}' | grep -q 'cluster database'
          ! kubectl get job restore-over-live 2>/dev/null

          # a target that already exists (the first restore's) is refused the same way: the webhook
          # and the operator ask the primary's segment server (EXISTS) before the Job would fail
          cat > /tmp/over-restored.yaml <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdRestore
          metadata:
            name: over-restored
            labels:
              webhook-check: skip
          spec:
            clusterName: repl
            backupName: repl-logical
            targetDatabase: restore-from-logical.fdb
          EOF
          out=$(kubectl apply -f /tmp/over-restored.yaml 2>&1 || true); echo "$out"
          echo "$out" | grep -q 'denied the request: targetDatabase restore-from-logical.fdb already exists on repl-0'
          if kubectl get firebirdrestore over-restored 2>/dev/null; then echo "over-restored was admitted"; exit 1; fi
          kubectl patch validatingwebhookconfiguration cloudnative-firebird-validating-webhook --type=json \
            -p '[{"op":"add","path":"/webhooks/0/objectSelector","value":{"matchExpressions":[{"key":"webhook-check","operator":"NotIn","values":["skip"]}]}}]'
          for i in $(seq 1 20); do kubectl apply -f /tmp/over-restored.yaml 2>/dev/null && break; sleep 3; done
          kubectl patch validatingwebhookconfiguration cloudnative-firebird-validating-webhook --type=json \
            -p '[{"op":"remove","path":"/webhooks/0/objectSelector"}]'
          wait_phase firebirdrestore over-restored Failed restore-over-restored
          kubectl get firebirdrestore over-restored -o jsonpath='{.status.error}' | grep -q 'already exists on repl-0'
          ! kubectl get job restore-over-restored 2>/dev/null
          [ "$(count restore-from-logical.fdb)" = "30" ]
          # without replication the backup file server answers (test-cluster)
          kubectl exec test-cluster-0 -c firebird -- touch $DB_DIR/stale.fdb
          out=$(kubectl apply -f - 2>&1 <<'EOF' || true
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdRestore
          metadata:
            name: over-stale
          spec:
            clusterName: test-cluster
            backupPath: whatever.fbk
            targetDatabase: stale.fdb
          EOF
          ); echo "$out"
          echo "$out" | grep -q 'denied the request: targetDatabase stale.fdb already exists on test-cluster-0'
          kubectl exec test-cluster-0 -c firebird -- rm $DB_DIR/stale.fdb
          echo "restores into existing targets are refused"

      - name: Verify service account and paused reconciliation
        if: matrix.track.id == 'extended'
        run: |
          # instance pods run with spec.serviceAccountName (workload identity for S3)
          kubectl create serviceaccount firebird-sa
          kubectl patch firebirdcluster test-cluster --type merge -p '{"spec":{"serviceAccountName":"firebird-sa"}}'
          timeout 120 bash -c 'until [ "$(kubectl get statefulset test-cluster -o jsonpath={.spec.template.spec.serviceAccountName})" = firebird-sa ]; do sleep 3; done'
          timeout 300 bash -c 'until [ "$(kubectl get pod test-cluster-0 -o jsonpath={.spec.serviceAccountName})" = firebird-sa ]; do sleep 5; done'
          kubectl wait pod/test-cluster-0 --for=condition=Ready --timeout=300s

          # a paused backup is left alone until the annotation is removed
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdBackup
          metadata:
            name: paused
            annotations:
              firebird.cloudnative-firebird.io/reconciliationDisabled: "true"
          spec:
            clusterName: repl
          EOF
          sleep 25
          ! kubectl get job backup-paused 2>/dev/null
          [ -z "$(kubectl get firebirdbackup paused -o jsonpath={.status.phase})" ]
          kubectl annotate firebirdbackup paused firebird.cloudnative-firebird.io/reconciliationDisabled-
          timeout 300 bash -c 'until [ "$(kubectl get firebirdbackup paused -o jsonpath={.status.phase})" = Completed ]; do
            [ "$(kubectl get firebirdbackup paused -o jsonpath={.status.phase})" = Failed ] && exit 1; sleep 5; done'
          echo "paused backup ran once resumed"

      - name: Verify declarative users
        if: matrix.track.id == 'core'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          # logs in as the managed user with role READER; prints "APP_USER READER" on success
          as_app() {
            kubectl exec "$1" -c firebird -- env "PW=it's s3cret" bash -c \
              'echo "select current_user, current_role from rdb\$database;" | isql -q -u app_user -p "$PW" -r reader localhost:/var/lib/firebird/data/mydb.fdb' 2>&1
          }
          wait_login() {
            for n in $(seq 1 24); do
              as_app "$1" | grep -qE 'APP_USER +READER' && return 0
              sleep 5
            done
            as_app "$1"; return 1
          }
          kubectl exec repl-0 -c firebird -- bash -c "echo 'create role reader; commit;' | isql -q localhost:$DB"
          kubectl create secret generic app-user-password --from-literal=password="it's s3cret"
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdUser
          metadata:
            name: app-user
          spec:
            clusterName: repl
            passwordSecret:
              name: app-user-password
            roles: [reader]
            reclaimPolicy: delete
          EOF
          timeout 300 bash -c \
            'until [ "$(kubectl get firebirduser app-user -o jsonpath={.status.phase})" = "Applied" ]; do sleep 5; done' \
            || { kubectl get firebirduser app-user -o yaml; kubectl logs job/fbuser-app-user || true; exit 1; }
          kubectl get firebirduser app-user
          # the user is in every instance's security database; the role grant replicates
          for pod in repl-0 repl-1 repl-2; do wait_login $pod; done
          echo "user applied on every instance"

          # users live in the security database on the instance volume: they survive pod re-creation
          kubectl delete pod repl-1 --wait=true
          # kubectl wait fails at once while the StatefulSet has not re-created the pod yet
          timeout 300 bash -c 'until kubectl get pod repl-1 >/dev/null 2>&1; do sleep 3; done'
          kubectl wait pod/repl-1 --for=condition=Ready --timeout=300s
          wait_login repl-1
          echo "user survived pod re-creation"

          # reclaimPolicy delete drops the user before the resource goes away, also from an
          # instance that is not ready at the time (fenced here): the deletion waits for it
          ANN=firebird.cloudnative-firebird.io/fencedInstances
          kubectl annotate firebirdcluster repl "$ANN=[\"repl-2\"]" --overwrite
          kubectl wait pod/repl-2 --for=condition=Ready=false --timeout=180s
          kubectl delete firebirduser app-user --wait=false
          timeout 180 bash -c \
            'until kubectl get firebirduser app-user -o jsonpath={.status.message} | grep -q "ready to drop the user: repl-2"; do sleep 5; done' \
            || { kubectl get firebirduser app-user -o yaml; exit 1; }
          kubectl get firebirduser app-user -o jsonpath='{.status}'; echo
          for pod in repl-0 repl-1; do as_app $pod | grep -q 'not defined'; done
          kubectl annotate firebirdcluster repl "$ANN=[]" --overwrite
          kubectl wait pod/repl-2 --for=condition=Ready --timeout=300s
          kubectl wait firebirduser/app-user --for=delete --timeout=240s
          for pod in repl-0 repl-1 repl-2; do
            if as_app $pod | grep -q 'APP_USER'; then echo "user still exists on $pod"; exit 1; fi
            as_app $pod | grep -q 'not defined'
          done
          timeout 120 bash -c 'while kubectl get firebirdcluster repl -o jsonpath={.status.fencedInstances} | grep -q repl-2; do sleep 3; done'
          echo "user dropped from every instance"

          # a user created with plain SQL (as before v0.12.0, or by an application) exists on one
          # instance only: hack/users/unmanaged-users.sh finds it and writes a FirebirdUser for it,
          # keeping its role (a FirebirdUser revokes the roles it does not list)
          primary=$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})
          kubectl exec "$primary" -c firebird -- bash -c \
            "echo \"create user legacy_app password 'l3gacy'; grant reader to user legacy_app; commit;\" | isql -q localhost:$DB"
          hack/users/unmanaged-users.sh repl | tee /tmp/unmanaged.txt
          [ "$(awk 'NR > 1' /tmp/unmanaged.txt | wc -l)" = 1 ]
          grep -Eq "^LEGACY_APP +yes +no +$primary\$" /tmp/unmanaged.txt
          hack/users/unmanaged-users.sh repl --yaml | tee /tmp/adopt.yaml
          grep -q 'username: LEGACY_APP' /tmp/adopt.yaml
          grep -q 'roles: \[READER\]' /tmp/adopt.yaml
          kubectl apply --dry-run=server -f /tmp/adopt.yaml
          kubectl exec "$primary" -c firebird -- bash -c "echo 'drop user legacy_app; commit;' | isql -q localhost:$DB"
          hack/users/unmanaged-users.sh repl 2>&1 | grep -q 'every user of cluster repl is managed'

      - name: Verify declarative roles
        if: matrix.track.id == 'core'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          privs() {
            kubectl exec "$1" -c firebird -- bash -c \
              "echo \"select trim(rdb\\\$relation_name) || ':' || trim(rdb\\\$privilege) from rdb\\\$user_privileges where rdb\\\$user = 'REPORTING' order by 1;\" | isql -q localhost:$DB" \
              | grep -oE '^[A-Z_]+:[A-Z]' | tr '\n' ' '
          }
          wait_privs() {
            for n in $(seq 1 36); do [ "$(privs "$1")" = "$2" ] && return 0; sleep 5; done
            echo "$1 has privileges [$(privs "$1")], expected [$2]"; kubectl get firebirdrole reporting -o yaml; kubectl logs job/fbrole-reporting || true; return 1
          }
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdRole
          metadata:
            name: reporting
          spec:
            clusterName: repl
            privileges:
              - privileges: [SELECT]
                object: { kind: table, name: app }
            reclaimPolicy: delete
          EOF
          timeout 300 bash -c 'until [ "$(kubectl get firebirdrole reporting -o jsonpath={.status.phase})" = "Applied" ]; do sleep 5; done' \
            || { kubectl get firebirdrole reporting -o yaml; kubectl logs job/fbrole-reporting || true; exit 1; }
          # applied on the primary, replicated to the replicas
          wait_privs repl-0 'APP:S '
          wait_privs repl-1 'APP:S '
          # declarative: a privilege removed from the spec is revoked
          kubectl patch firebirdrole reporting --type merge -p '{"spec":{"privileges":[{"privileges":["INSERT"],"object":{"kind":"table","name":"app"}}]}}'
          wait_privs repl-0 'APP:I '
          wait_privs repl-1 'APP:I '
          # reclaimPolicy delete drops the role
          kubectl delete firebirdrole reporting --timeout=180s
          wait_privs repl-0 ''
          [ "$(kubectl exec repl-0 -c firebird -- bash -c "echo \"select count(*) from rdb\\\$roles where rdb\\\$role_name = 'REPORTING';\" | isql -q localhost:$DB" | awk '$1 ~ /^[0-9]+$/ { print $1 }')" = 0 ]
          echo "role applied, updated and dropped"

      - name: Verify re-seeding a replica
        if: matrix.track.id == 'core'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          count() { kubectl exec "$1" -c firebird -- bash -c "echo 'select count(*) from app;' | isql -q localhost:$DB" | awk '$1 ~ /^[0-9]+$/ { print $1 }'; }
          old_uid=$(kubectl get pod repl-2 -o jsonpath={.metadata.uid})
          kubectl annotate pod repl-2 firebird.cloudnative-firebird.io/reseed=true
          # the operator lists the request and restarts the pod (within a resync interval)
          timeout 180 bash -c "until [ -n \"\$(kubectl get pod repl-2 -o jsonpath={.metadata.uid} 2>/dev/null)\" ] && [ \"\$(kubectl get pod repl-2 -o jsonpath={.metadata.uid} 2>/dev/null)\" != '$old_uid' ]; do sleep 3; done"
          kubectl wait pod/repl-2 --for=condition=Ready --timeout=300s
          kubectl logs repl-2 -c replication-init | tee /tmp/repl-2-reseed.log
          grep -q 're-seed requested' /tmp/repl-2-reseed.log
          grep -q 'seeded replica from' /tmp/repl-2-reseed.log
          kubectl exec repl-0 -c firebird -- bash -c "echo 'insert into app values (31, '\''after'\''); commit;' | isql -q localhost:$DB"
          for n in $(seq 1 36); do [ "$(count repl-2)" = "31" ] && break; sleep 5; done
          [ "$(count repl-2)" = "31" ]
          timeout 120 bash -c 'while kubectl get firebirdcluster repl -o jsonpath={.status.reseedingInstances} | grep -q repl-2; do sleep 5; done'
          echo "replica re-seeded and following the primary"

      - name: Verify re-creating a replica's volume
        if: matrix.track.id == 'core'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          count() { kubectl exec "$1" -c firebird -- bash -c "echo 'select count(*) from app;' | isql -q localhost:$DB" | awk '$1 ~ /^[0-9]+$/ { print $1 }'; }
          old_claim=$(kubectl get pvc firebird-data-repl-2 -o jsonpath={.metadata.uid})
          kubectl annotate pod repl-2 firebird.cloudnative-firebird.io/reseed=volume
          # the operator deletes the claim and the pod until the StatefulSet made a new claim
          timeout 300 bash -c "until c=\$(kubectl get pvc firebird-data-repl-2 -o jsonpath={.metadata.uid} 2>/dev/null) && [ -n \"\$c\" ] && [ \"\$c\" != '$old_claim' ]; do sleep 3; done" \
            || { kubectl get pvc,pods; kubectl get firebirdcluster repl -o jsonpath='{.status.recreatingVolumes}'; exit 1; }
          timeout 300 bash -c 'until kubectl get pod repl-2 >/dev/null 2>&1; do sleep 3; done'
          kubectl wait pod/repl-2 --for=condition=Ready --timeout=300s
          timeout 120 bash -c 'while kubectl get firebirdcluster repl -o jsonpath={.status.recreatingVolumes} | grep -q repl-2; do sleep 5; done'
          # a new, empty volume: seeded like a new replica
          kubectl logs repl-2 -c replication-init | tee /tmp/repl-2-volume.log
          grep -qE 'replica seed|offline seed' /tmp/repl-2-volume.log
          expected=$(count repl-0)
          for n in $(seq 1 36); do [ "$(count repl-2)" = "$expected" ] && break; sleep 5; done
          [ "$(count repl-2)" = "$expected" ]
          kubectl get events --field-selector involvedObject.name=repl,reason=VolumeRecreated -o name | grep -q .
          echo "replica runs on a new volume ($old_claim replaced) and follows the primary"

      - name: Verify planned switchover
        if: matrix.track.id == 'core'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          sql() { kubectl exec "$1" -c firebird -- bash -c "echo \"$2\" | isql -q localhost:$DB" 2>&1; }
          count() { sql "$1" 'select count(*) from app;' | awk '$1 ~ /^[0-9]+$/ { print $1 }'; }
          wait_count() {
            for n in $(seq 1 36); do [ "$(count "$1")" = "$2" ] && return 0; sleep 5; done
            echo "$1 has $(count "$1") rows, expected $2"; return 1
          }
          before=$(count repl-0)
          target_uid=$(kubectl get pod repl-1 -o jsonpath={.metadata.uid})
          kubectl annotate firebirdcluster repl firebird.cloudnative-firebird.io/targetPrimary=repl-1
          timeout 600 bash -c \
            'until [ "$(kubectl get firebirdcluster repl -o jsonpath={.status.switchover.phase})" = "Completed" ]; do
               p=$(kubectl get firebirdcluster repl -o jsonpath={.status.switchover.phase}); [ "$p" = "Failed" ] && exit 1; sleep 5; done' \
            || { kubectl get firebirdcluster repl -o jsonpath='{.status.switchover}'; echo; kubectl logs job/repl-switchover || true; exit 1; }
          kubectl get firebirdcluster repl -o jsonpath='{.status.switchover}'; echo
          [ "$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})" = "repl-1" ]
          # promoted in place: the target kept its pod (only the old primary restarted)
          [ "$(kubectl get firebirdcluster repl -o jsonpath={.status.switchover.promotedInPlace})" = "true" ]
          [ "$(kubectl get pod repl-1 -o jsonpath={.metadata.uid})" = "$target_uid" ]
          kubectl logs repl-1 -c segment-server | grep 'promoted in place'
          kubectl logs repl-0 -c replication-init | grep 'demoted to replica'
          # nothing was lost, the new primary takes writes and both replicas follow it
          [ "$(count repl-1)" = "$before" ]
          for i in $(seq 101 110); do sql repl-1 "insert into app values ($i, 'new primary'); commit;" >/dev/null; done
          wait_count repl-0 $((before + 10))
          wait_count repl-2 $((before + 10))
          if sql repl-0 "insert into app values (999, 'old primary'); commit;" | grep -q 'read-only'; then
            echo "old primary is a read-only replica"
          else
            echo "old primary accepted a write"; exit 1
          fi
          echo "switchover to repl-1 completed; replicas follow the new primary"

          # maintenance Jobs follow the primary, not the <name> Service
          kubectl patch firebirdcluster repl --type merge -p '{"spec":{"autoSweep":{"enabled":true},"diagnostics":{"enabled":true}}}'
          for cj in repl-sweep repl-diagnostics; do
            timeout 120 bash -c "until kubectl get cronjob $cj -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].args[0]}' 2>/dev/null | grep -q 'repl-1.repl-headless:'; do sleep 3; done" \
              || { kubectl get cronjob $cj -o yaml; exit 1; }
            kubectl create job "$cj-ci" --from=cronjob/$cj
            kubectl wait job/"$cj-ci" --for=condition=Complete --timeout=180s || { kubectl logs job/"$cj-ci"; exit 1; }
            kubectl logs job/"$cj-ci"
            kubectl delete job "$cj-ci" --wait=false
          done
          kubectl patch firebirdcluster repl --type merge -p '{"spec":{"autoSweep":null,"diagnostics":null}}'

      - name: Verify automatic failover
        if: matrix.track.id == 'core'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          sql() { kubectl exec "$1" -c firebird -- bash -c "echo \"$2\" | isql -q localhost:$DB" 2>&1; }
          count() { sql "$1" 'select count(*) from app;' | awk '$1 ~ /^[0-9]+$/ { print $1 }'; }
          wait_count() {
            for n in $(seq 1 36); do [ "$(count "$1")" = "$2" ] && return 0; sleep 5; done
            echo "$1 has $(count "$1") rows, expected $2"; return 1
          }
          old=$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})
          before=$(count "$old")
          kubectl patch firebirdcluster repl --type merge -p '{"spec":{"replication":{"failover":{"enabled":true,"delaySeconds":20}}}}'
          sleep 10
          # the primary's database stops answering (not fenced): its pod stays up but not ready
          kubectl exec "$old" -c firebird -- bash -c \
            "fbsvcmgr localhost:service_mgr action_properties dbname $DB prp_shutdown_mode prp_sm_full prp_force_shutdown 0"
          timeout 600 bash -c \
            'until kubectl get firebirdcluster repl -o jsonpath="{.status.switchover.kind} {.status.switchover.phase}" | grep -q "failover Completed"; do
               kubectl get firebirdcluster repl -o jsonpath="{.status.switchover.kind} {.status.switchover.phase}" | grep -q "failover Failed" && exit 1; sleep 5; done' \
            || { kubectl get firebirdcluster repl -o jsonpath='{.status.switchover}'; echo; kubectl logs job/repl-failover || true; exit 1; }
          kubectl get firebirdcluster repl -o jsonpath='{.status.switchover}'; echo
          new=$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})
          [ "$new" != "$old" ]
          [ "$(kubectl get firebirdcluster repl -o jsonpath='{.metadata.annotations.firebird\.cloudnative-firebird\.io/targetPrimary}')" = "$new" ]
          # promoted in place by the promote Job (no restart of the elected replica)
          [ "$(kubectl get firebirdcluster repl -o jsonpath={.status.switchover.promotedInPlace})" = "true" ]
          kubectl logs "$new" -c segment-server | grep 'promoted in place'
          # no writes happened while the primary was down: nothing is lost here
          [ "$(count "$new")" = "$before" ]
          for i in $(seq 201 210); do sql "$new" "insert into app values ($i, 'after failover'); commit;" >/dev/null; done
          # the old primary comes back re-seeded, as a read-only replica (the operator deletes the
          # pod for that: wait until the StatefulSet re-created it)
          timeout 300 bash -c "until kubectl get pod $old >/dev/null 2>&1; do sleep 3; done"
          kubectl wait pod/"$old" --for=condition=Ready --timeout=300s
          kubectl logs "$old" -c replication-init | grep 're-seed requested'
          for pod in repl-0 repl-1 repl-2; do [ "$pod" = "$new" ] || wait_count "$pod" $((before + 10)); done
          if sql "$old" "insert into app values (998, 'old primary'); commit;" | grep -q 'read-only'; then
            echo "old primary is a re-seeded read-only replica"
          else
            echo "old primary accepted a write"; exit 1
          fi
          echo "failed over from $old to $new"

      - name: Verify failover of a cut-off primary
        if: matrix.track.id == 'core'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          sql() { kubectl exec "$1" -c firebird -- bash -c "echo \"$2\" | isql -q localhost:$DB" 2>&1; }
          count() { sql "$1" 'select count(*) from app;' | awk '$1 ~ /^[0-9]+$/ { print $1 }'; }
          # the previous failover promoted its target in place, without the pod template enabling
          # failover changed: the rolling update restarts it (the primary, last) once the failover
          # completed. Cutting a pod off before that would be undone by its restart.
          SEL=firebird.cloudnative-firebird.io/cluster=repl,app.kubernetes.io/component=database
          updated() {
            rev=$(kubectl get statefulset repl -o jsonpath={.status.updateRevision})
            kubectl get pods -l "$SEL" \
              -o jsonpath='{range .items[*]}{.metadata.labels.controller-revision-hash} {.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              | grep -c "^$rev True$"
          }
          for n in $(seq 1 120); do
            [ "$(updated)" = 3 ] && [ -z "$(kubectl get firebirdcluster repl -o jsonpath={.status.rollingUpdate})" ] && break
            sleep 5
          done
          [ "$(updated)" = 3 ] || { kubectl get pods -l "$SEL" -L controller-revision-hash; exit 1; }
          old=$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})
          before=$(count "$old")
          last_failover=$(kubectl get firebirdcluster repl -o jsonpath={.status.switchover.startTime})
          # the primary's pod loses every peer (the other instances and the operator) and cluster
          # DNS, but keeps the API server and the kubelet: it stays ready until its isolation check
          # fences it (nothing has reached it for contactTimeoutSeconds, 60, and none of the peers it
          # knew from DNS answers), before the operator promotes a replica (45s after every replica
          # lost it). Without DNS it could not tell it has replicas before v0.78.0. The rules go into the pod's network namespace
          # from the kind node (the namespace's PodSecurity level does not allow NET_ADMIN in a
          # debug container).
          old_uid=$(kubectl get pod "$old" -o jsonpath={.metadata.uid})
          own=$(kubectl get pod "$old" -o jsonpath={.status.podIP})
          # the operator publishes every instance's current address in the cluster ConfigMap, which
          # the primary reads without DNS (the kubelet updates the mounted file within ~2 minutes)
          for ip in $(kubectl get pods -l "$SEL" -o jsonpath='{.items[*].status.podIP}'); do
            timeout 180 bash -c "until kubectl exec $old -c segment-server -- cat /etc/firebird-operator/peer-addresses | grep -qx $ip; do sleep 5; done" \
              || { kubectl exec "$old" -c segment-server -- cat /etc/firebird-operator/peer-addresses; exit 1; }
          done
          peers=$(for ns in default cloudnative-firebird-system; do
              kubectl get pods -n "$ns" -o jsonpath='{range .items[*]}{.status.podIP} {.status.hostIP}{"\n"}{end}'
            done | awk -v own="$own" '$1 != "" && $1 != $2 && $1 != own { print $1 }' | sort -u)
          dns=$( (kubectl get service kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}'; echo
              kubectl get pods -n kube-system -l k8s-app=kube-dns -o jsonpath='{range .items[*]}{.status.podIP}{"\n"}{end}') | grep .)
          echo "cutting $old ($own) off from: $peers and DNS: $dns"
          node=firebird-test-control-plane
          sandbox=$(docker exec "$node" crictl pods --namespace default --name "^$old\$" --state ready -q | head -1)
          pid=$(docker exec "$node" crictl inspectp -o go-template --template '{{.info.pid}}' "$sandbox")
          for ip in $peers $dns; do
            docker exec "$node" nsenter -t "$pid" -n iptables -I INPUT -s "$ip" -j DROP
            docker exec "$node" nsenter -t "$pid" -n iptables -I OUTPUT -d "$ip" -j DROP
          done
          # while the old pod still runs, its isolation check fences it (it reaches the API server)
          self_fenced=no
          for n in $(seq 1 120); do
            if [ "$self_fenced" = no ] && [ "$(kubectl get pod "$old" -o jsonpath={.metadata.uid} 2>/dev/null)" = "$old_uid" ] &&
              kubectl logs "$old" -c segment-server 2>/dev/null | tee /tmp/cut-off-primary.log | grep 'neither the operator nor any replica has reached this primary'; then
              self_fenced=yes
            fi
            kubectl get firebirdcluster repl -o jsonpath='{.status.switchover.kind} {.status.switchover.phase}' | grep -q 'failover Completed' &&
              [ "$(kubectl get firebirdcluster repl -o jsonpath={.status.switchover.startTime})" != "$last_failover" ] && break
            sleep 5
          done
          kubectl get firebirdcluster repl -o jsonpath='{.status.switchover.kind} {.status.switchover.phase}' | grep -q 'failover Completed' \
            || { kubectl get firebirdcluster repl -o jsonpath='{.status.switchover}'; echo; kubectl get pods -o wide; exit 1; }
          [ "$self_fenced" = yes ] || { echo "the cut-off primary did not fence itself before it was replaced"; exit 1; }
          # it fenced itself without DNS, from the peers it knew
          grep -q 'cluster DNS did not answer' /tmp/cut-off-primary.log
          grep -q 'cluster DNS failing, and no known peer answers' /tmp/cut-off-primary.log
          kubectl get events --field-selector involvedObject.name=repl -o jsonpath='{range .items[*]}{.message}{"\n"}{end}' \
            | grep "cut off" | tee /dev/stderr | grep -q "the operator cannot reach it"
          new=$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})
          [ "$new" != "$old" ]
          [ "$(count "$new")" = "$before" ]
          # the cut-off primary's pod was deleted (that ends its writes) and comes back re-seeded
          timeout 300 bash -c "until uid=\$(kubectl get pod $old -o jsonpath={.metadata.uid} 2>/dev/null) &&
            [ -n \"\$uid\" ] && [ \"\$uid\" != $old_uid ]; do sleep 3; done"
          kubectl wait pod/"$old" --for=condition=Ready --timeout=300s
          kubectl logs "$old" -c replication-init | grep 're-seed requested'
          sql "$old" "insert into app values (997, 'old primary'); commit;" | grep -q 'read-only'
          echo "failed over from the cut-off primary $old to $new (it fenced itself first)"

      - name: Verify rolling update with the primary last
        if: matrix.track.id == 'core'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          sql() { kubectl exec "$1" -c firebird -- bash -c "echo \"$2\" | isql -q localhost:$DB" 2>&1; }
          count() { sql "$1" 'select count(*) from app;' | awk '$1 ~ /^[0-9]+$/ { print $1 }'; }
          wait_count() {
            for n in $(seq 1 36); do [ "$(count "$1")" = "$2" ] && return 0; sleep 5; done
            echo "$1 has $(count "$1") rows, expected $2"; return 1
          }
          [ "$(kubectl get statefulset repl -o jsonpath={.spec.updateStrategy.type})" = "OnDelete" ]
          primary=$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})
          before=$(count "$primary")
          last_failover=$(kubectl get firebirdcluster repl -o jsonpath={.status.switchover.startTime})
          # a template change; automatic failover is still enabled (20 s) from the previous step
          # (with CPU resources, so the next step can change them in place)
          kubectl patch firebirdcluster repl --type merge -p '{"spec":{"env":[{"name":"ROLLING_UPDATE_TEST","value":"1"}],"resources":{"requests":{"cpu":"100m"},"limits":{"cpu":"1"}}}}'
          timeout 120 bash -c 'until kubectl get statefulset repl -o jsonpath={.spec.template.spec.containers[0].env} | grep -q ROLLING_UPDATE_TEST &&
            [ "$(kubectl get statefulset repl -o jsonpath={.status.observedGeneration})" = "$(kubectl get statefulset repl -o jsonpath={.metadata.generation})" ]; do sleep 3; done'
          rev=$(kubectl get statefulset repl -o jsonpath={.status.updateRevision})
          echo "updating to $rev"
          SEL=firebird.cloudnative-firebird.io/cluster=repl,app.kubernetes.io/component=database
          updated() {
            kubectl get pods -l "$SEL" \
              -o jsonpath='{range .items[*]}{.metadata.labels.controller-revision-hash} {.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              | grep -c "^$rev True$"
          }
          for n in $(seq 1 180); do [ "$(updated)" = 3 ] && break; sleep 5; done
          [ "$(updated)" = 3 ] || {
            kubectl get firebirdcluster repl -o jsonpath='{.status.rollingUpdate}'; echo
            kubectl get pods -l "$SEL" -L controller-revision-hash; exit 1
          }
          timeout 120 bash -c 'until [ "$(kubectl get firebirdcluster repl -o jsonpath={.status.phase})" = "Running" ] &&
            [ -z "$(kubectl get firebirdcluster repl -o jsonpath={.status.rollingUpdate})" ]; do sleep 5; done'
          # the primary was restarted last, in place: no switchover or failover happened
          kubectl get pods -l "$SEL" \
            -o custom-columns=NAME:.metadata.name,CREATED:.metadata.creationTimestamp --sort-by=.metadata.creationTimestamp
          last=$(kubectl get pods -l "$SEL" \
            --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
          [ "$last" = "$primary" ]
          [ "$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})" = "$primary" ]
          [ "$(kubectl get firebirdcluster repl -o jsonpath={.status.switchover.startTime})" = "$last_failover" ]
          [ "$(count "$primary")" = "$before" ]
          for i in $(seq 301 305); do sql "$primary" "insert into app values ($i, 'after update'); commit;" >/dev/null; done
          for pod in repl-0 repl-1 repl-2; do [ "$pod" = "$primary" ] || wait_count "$pod" $((before + 5)); done
          echo "rolling update finished with the primary $primary last"

      - name: Verify resources are resized in place
        if: matrix.track.id == 'core'
        run: |
          SEL=firebird.cloudnative-firebird.io/cluster=repl,app.kubernetes.io/component=database
          uids() { kubectl get pods -l "$SEL" -o jsonpath='{range .items[*]}{.metadata.name}={.metadata.uid} {end}'; }
          before=$(uids); echo "pods: $before"
          primary=$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})
          # only the CPU limit changes: no restart, the pods are resized and run the new revision
          kubectl patch firebirdcluster repl --type merge -p '{"spec":{"resources":{"requests":{"cpu":"100m"},"limits":{"cpu":"2"}}}}'
          timeout 120 bash -c 'until [ "$(kubectl get statefulset repl -o jsonpath={.spec.template.spec.containers[0].resources.limits.cpu})" = 2 ] &&
            [ "$(kubectl get statefulset repl -o jsonpath={.status.observedGeneration})" = "$(kubectl get statefulset repl -o jsonpath={.metadata.generation})" ]; do sleep 3; done'
          rev=$(kubectl get statefulset repl -o jsonpath={.status.updateRevision})
          updated() {
            kubectl get pods -l "$SEL" \
              -o jsonpath='{range .items[*]}{.metadata.labels.controller-revision-hash} {.status.containerStatuses[?(@.name=="firebird")].resources.limits.cpu}{"\n"}{end}' \
              | grep -c "^$rev 2$"
          }
          for n in $(seq 1 60); do [ "$(updated)" = 3 ] && break; sleep 5; done
          [ "$(updated)" = 3 ] || {
            kubectl get firebirdcluster repl -o jsonpath='{.status.rollingUpdate}'; echo
            kubectl get pods -l "$SEL" -o yaml | grep -E 'name: repl-|resize|cpu|reason' ; exit 1
          }
          after=$(uids); echo "pods: $after"
          [ "$after" = "$before" ] || { echo "instances were restarted"; exit 1; }
          [ "$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})" = "$primary" ]
          kubectl get events --field-selector involvedObject.name=repl -o jsonpath='{range .items[*]}{.message}{"\n"}{end}' | grep -q 'resized in place'
          timeout 120 bash -c 'until [ -z "$(kubectl get firebirdcluster repl -o jsonpath={.status.rollingUpdate})" ]; do sleep 5; done'
          echo "CPU limit changed in place on every instance, nothing restarted"

      - name: Verify the primary Lease
        if: matrix.track.id == 'core'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          sql() { kubectl exec "$1" -c firebird -- bash -c "echo \"$2\" | isql -q localhost:$DB" 2>&1; }
          count() { sql "$1" 'select count(*) from app;' | awk '$1 ~ /^[0-9]+$/ { print $1 }'; }
          SEL=firebird.cloudnative-firebird.io/cluster=repl,app.kubernetes.io/component=database
          # the primary holds its Lease by default since automatic failover was enabled on this
          # cluster (v0.87.0: recorded on its first reconcile): the lease-holder sidecar is already
          # in every instance; setting it explicitly changes nothing
          [ "$(kubectl get firebirdcluster repl -o jsonpath='{.metadata.annotations.firebird\.cloudnative-firebird\.io/primary-lease}')" = enabled ]
          kubectl get statefulset repl -o jsonpath="{.spec.template.spec.initContainers[*].name}" | grep -q lease-holder
          kubectl patch firebirdcluster repl --type merge -p '{"spec":{"replication":{"failover":{"primaryLease":{"enabled":true}}}}}'
          sleep 5
          rev=$(kubectl get statefulset repl -o jsonpath={.status.updateRevision})
          updated() {
            kubectl get pods -l "$SEL" \
              -o jsonpath='{range .items[*]}{.metadata.labels.controller-revision-hash} {.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              | grep -c "^$rev True$"
          }
          for n in $(seq 1 120); do
            [ "$(updated)" = 3 ] && [ -z "$(kubectl get firebirdcluster repl -o jsonpath={.status.rollingUpdate})" ] && break
            sleep 5
          done
          [ "$(updated)" = 3 ] || { kubectl get pods -l "$SEL" -L controller-revision-hash; kubectl get firebirdcluster repl -o jsonpath='{.status.rollingUpdate}'; exit 1; }
          kubectl get role/repl-primary-lease rolebinding/repl-primary-lease
          primary=$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})
          # renewed by the primary's sidecar through its own ServiceAccount: the renewal time moves on
          t1=$(kubectl get lease repl-lease -o jsonpath={.spec.renewTime}); sleep 12
          t2=$(kubectl get lease repl-lease -o jsonpath={.spec.renewTime})
          [ "$t1" != "$t2" ] || { echo "the Lease was not renewed ($t1)"; kubectl logs "$primary" -c lease-holder; exit 1; }
          kubectl logs "$primary" -c lease-holder | grep 'holding the Lease'
          replica=$(kubectl get pods -l "$SEL" -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep -v "^$primary$" | head -1)
          kubectl logs "$replica" -c lease-holder | grep 'not the primary'
          before=$(count "$primary")
          last_failover=$(kubectl get firebirdcluster repl -o jsonpath={.status.switchover.startTime})
          old_uid=$(kubectl get pod "$primary" -o jsonpath={.metadata.uid})
          # the primary is cut off from the API server only: the operator and the replicas still
          # reach it (the isolation check does not fence it), but it cannot renew its Lease, so it
          # fences itself once the Lease's duration (15 s) passed, and the operator, finding it
          # not ready, fails over once the Lease expired. The rules go into the pod's network
          # namespace from the kind node, as in the cut-off primary step.
          api_ip=$(kubectl get endpoints kubernetes -o jsonpath='{.subsets[0].addresses[0].ip}')
          api_port=$(kubectl get endpoints kubernetes -o jsonpath='{.subsets[0].ports[0].port}')
          svc_ip=$(kubectl get service kubernetes -o jsonpath={.spec.clusterIP})
          node=firebird-test-control-plane
          sandbox=$(docker exec "$node" crictl pods --namespace default --name "^$primary\$" --state ready -q | head -1)
          pid=$(docker exec "$node" crictl inspectp -o go-template --template '{{.info.pid}}' "$sandbox")
          docker exec "$node" nsenter -t "$pid" -n iptables -I OUTPUT -d "$svc_ip" -p tcp --dport 443 -j DROP
          docker exec "$node" nsenter -t "$pid" -n iptables -I OUTPUT -d "$api_ip" -p tcp --dport "$api_port" -j DROP
          echo "cut $primary off from the API server ($svc_ip:443, $api_ip:$api_port)"
          fenced=no
          for n in $(seq 1 120); do
            if [ "$fenced" = no ] && [ "$(kubectl get pod "$primary" -o jsonpath={.metadata.uid} 2>/dev/null)" = "$old_uid" ] &&
              kubectl logs "$primary" -c lease-holder 2>/dev/null | tee /tmp/lease-holder.log | grep -q 'fenced: the Lease could not be renewed'; then
              fenced=yes
              kubectl logs "$primary" -c segment-server > /tmp/lease-segment-server.log 2>/dev/null || true
            fi
            kubectl get firebirdcluster repl -o jsonpath='{.status.switchover.kind} {.status.switchover.phase}' | grep -q 'failover Completed' &&
              [ "$(kubectl get firebirdcluster repl -o jsonpath={.status.switchover.startTime})" != "$last_failover" ] && break
            sleep 5
          done
          kubectl get firebirdcluster repl -o jsonpath='{.status.switchover.kind} {.status.switchover.phase}' | grep -q 'failover Completed' \
            || { kubectl get firebirdcluster repl -o jsonpath='{.status.switchover}'; echo; cat /tmp/lease-holder.log 2>/dev/null; kubectl get pods -o wide; exit 1; }
          [ "$(kubectl get firebirdcluster repl -o jsonpath={.status.switchover.startTime})" != "$last_failover" ]
          [ "$fenced" = yes ] || { echo "the primary did not fence itself when it could not renew its Lease"; cat /tmp/lease-holder.log 2>/dev/null; exit 1; }
          grep -E 'cannot (read|renew) the Lease' /tmp/lease-holder.log
          grep 'cannot renew the Lease: the API server has not answered' /tmp/lease-segment-server.log
          grep -q 'fencing the primary (database in full shutdown)' /tmp/lease-segment-server.log
          new=$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})
          [ "$new" != "$primary" ]
          [ "$(count "$new")" = "$before" ]
          # the new primary holds the Lease now
          timeout 120 bash -c "until kubectl logs $new -c lease-holder | grep -q 'holding the Lease'; do sleep 5; done"
          # the old primary comes back re-seeded (its pod is deleted, which removes the rules too)
          timeout 300 bash -c "until uid=\$(kubectl get pod $primary -o jsonpath={.metadata.uid} 2>/dev/null) &&
            [ -n \"\$uid\" ] && [ \"\$uid\" != $old_uid ]; do sleep 3; done"
          kubectl wait pod/"$primary" --for=condition=Ready --timeout=300s
          kubectl logs "$primary" -c replication-init | grep 're-seed requested'
          kubectl logs "$primary" -c lease-holder | grep 'not the primary'
          echo "the primary fenced itself when it could not renew its Lease; failed over from $primary to $new"

      - name: Verify a cluster without replication is updated by the operator, in place when it can
        if: matrix.track.id == 'extended'
        run: |
          SEL=firebird.cloudnative-firebird.io/cluster=test-cluster,app.kubernetes.io/component=database
          [ "$(kubectl get statefulset test-cluster -o jsonpath={.spec.updateStrategy.type})" = "OnDelete" ]
          n=$(kubectl get statefulset test-cluster -o jsonpath={.spec.replicas})
          uids() { kubectl get pods -l "$SEL" -o jsonpath='{range .items[*]}{.metadata.name}={.metadata.uid} {end}'; }
          # every pod runs the update revision with this CPU limit, and the rolling update is over
          rolled() {
            # the operator has patched the template and the StatefulSet controller has seen it
            timeout 120 bash -c "until [ \"\$(kubectl get statefulset test-cluster -o jsonpath={.spec.template.spec.containers[0].resources.limits.cpu})\" = $1 ] &&
              [ \"\$(kubectl get statefulset test-cluster -o jsonpath={.status.observedGeneration})\" = \"\$(kubectl get statefulset test-cluster -o jsonpath={.metadata.generation})\" ]; do sleep 3; done"
            rev=$(kubectl get statefulset test-cluster -o jsonpath={.status.updateRevision})
            for i in $(seq 1 120); do
              ok=$(kubectl get pods -l "$SEL" \
                -o jsonpath='{range .items[*]}{.metadata.labels.controller-revision-hash} {.status.containerStatuses[?(@.name=="firebird")].resources.limits.cpu} {.status.containerStatuses[?(@.name=="firebird")].ready}{"\n"}{end}' \
                | grep -c "^$rev $1 true$" || true)
              [ "$ok" = "$n" ] && [ -z "$(kubectl get firebirdcluster test-cluster -o jsonpath={.status.rollingUpdate})" ] && return 0
              sleep 5
            done
            kubectl get firebirdcluster test-cluster -o jsonpath='{.status.rollingUpdate}'; echo
            kubectl get pods -l "$SEL" -o yaml | grep -E 'name: test-cluster-|resize|cpu|reason'
            return 1
          }
          # resources from none: the QoS class changes, so the operator restarts the instances
          # one at a time (highest ordinal first), as the StatefulSet controller did
          before=$(uids); echo "pods: $before"
          kubectl patch firebirdcluster test-cluster --type merge -p '{"spec":{"resources":{"requests":{"cpu":"100m"},"limits":{"cpu":"1"}}}}'
          rolled 1
          after=$(uids); echo "pods: $after"
          [ "$after" != "$before" ]
          kubectl get events --field-selector involvedObject.name=test-cluster -o jsonpath='{range .items[*]}{.message}{"\n"}{end}' | grep -q "restarting test-cluster-1 on revision"
          # only the CPU limit changes: resized in place, nothing restarted
          kubectl patch firebirdcluster test-cluster --type merge -p '{"spec":{"resources":{"requests":{"cpu":"100m"},"limits":{"cpu":"2"}}}}'
          rolled 2
          [ "$(uids)" = "$after" ] || { echo "instances were restarted"; exit 1; }
          kubectl get events --field-selector involvedObject.name=test-cluster -o jsonpath='{range .items[*]}{.message}{"\n"}{end}' | grep -q 'resized in place'
          echo "a cluster without replication is resized in place"

      - name: Verify enabling replication on an existing cluster
        if: matrix.track.id == 'extended'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          sql() { kubectl exec "$1" -c firebird -- bash -c "echo \"$2\" | isql -q localhost:${3:-$DB}" 2>&1; }
          count() { sql "$1" 'select count(*) from app;' "${2:-$DB}" | awk '$1 ~ /^[0-9]+$/ { print $1 }'; }
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdCluster
          metadata:
            name: late
          spec:
            instances: 2
            storage:
              size: 1Gi
            bootstrap:
              initSql: "CREATE TABLE app (id INTEGER PRIMARY KEY, note VARCHAR(20)); COMMIT;"
          EOF
          for pod in late-0 late-1; do
            timeout 300 bash -c "until kubectl get pod $pod >/dev/null 2>&1; do sleep 3; done"
            kubectl wait pod/$pod --for=condition=Ready --timeout=300s
          done
          # without replication every instance has a database of its own
          for i in $(seq 1 10); do sql late-0 "insert into app values ($i, 'primary'); commit;" >/dev/null; done
          sql late-1 "insert into app values (500, 'own'); commit;" >/dev/null
          old_uid=$(kubectl get pod late-1 -o jsonpath={.metadata.uid})

          kubectl patch firebirdcluster late --type merge -p '{"spec":{"replication":{"enabled":true,"archiveTimeoutSeconds":3}}}'
          # the primary converts first, then the other instance is seeded from it
          timeout 600 bash -c "until kubectl logs late-1 -c replication-init 2>/dev/null | grep -q 'seeded replica'; do sleep 5; done" \
            || { kubectl get pods -l firebird.cloudnative-firebird.io/cluster=late; kubectl get firebirdcluster late -o jsonpath='{.status.rollingUpdate}'; exit 1; }
          kubectl wait pod/late-0 pod/late-1 --for=condition=Ready --timeout=300s
          kubectl logs late-0 -c replication-init | tee /dev/stderr | grep -q 'existing primary database now publishes'
          kubectl logs late-1 -c replication-init | tee /dev/stderr | grep -q 'keeping it as'
          [ "$(count late-1)" = 10 ]
          for i in $(seq 11 15); do sql late-0 "insert into app values ($i, 'replicated'); commit;" >/dev/null; done
          for n in $(seq 1 36); do [ "$(count late-1)" = 15 ] && break; sleep 5; done
          [ "$(count late-1)" = 15 ]
          # the instance's own database was kept aside, not deleted
          kept=$(kubectl exec late-1 -c firebird -- sh -c 'ls /var/lib/firebird/data | grep pre-replication')
          [ "$(count late-1 "/var/lib/firebird/data/$kept")" = 1 ]
          echo "replication enabled on an existing cluster; late-1 follows late-0"

          # A stale offline bootstrap seed (the segments after it pruned) is refreshed when the
          # primary restarts; a replica seeded from it (late-0 is its only seed source) follows.
          ARCHIVE=/var/lib/firebird/data/replication/archive
          # a few more segments (archiveTimeoutSeconds: 3), then all but the newest are pruned
          for i in 16 17 18; do sql late-0 "insert into app values ($i, 'segment'); commit;" >/dev/null; sleep 5; done
          kubectl exec late-0 -c firebird -- sh -c "cd $ARCHIVE && ls | sort | head -n -1 | xargs -r rm -f && ls"
          kubectl delete pod late-0 --wait=true
          timeout 300 bash -c 'until kubectl get pod late-0 >/dev/null 2>&1; do sleep 3; done'
          kubectl wait pod/late-0 --for=condition=Ready --timeout=300s
          kubectl logs late-0 -c replication-init | tee /dev/stderr | grep -q 'offline bootstrap seed refreshed'
          old_uid=$(kubectl get pod late-1 -o jsonpath={.metadata.uid})
          kubectl annotate pod late-1 firebird.cloudnative-firebird.io/reseed=true
          timeout 300 bash -c "until [ -n \"\$(kubectl get pod late-1 -o jsonpath={.metadata.uid} 2>/dev/null)\" ] && [ \"\$(kubectl get pod late-1 -o jsonpath={.metadata.uid} 2>/dev/null)\" != '$old_uid' ]; do sleep 3; done"
          kubectl wait pod/late-1 --for=condition=Ready --timeout=300s
          kubectl logs late-1 -c replication-init | tee /dev/stderr | grep -q '(offline seed)'
          for i in 19 20; do sql late-0 "insert into app values ($i, 'after refresh'); commit;" >/dev/null; done
          for n in $(seq 1 36); do [ "$(count late-1)" = 20 ] && break; sleep 5; done
          [ "$(count late-1)" = 20 ]
          echo "refreshed offline seed seeded late-1, which follows late-0"

      - name: Verify instance fencing
        if: matrix.track.id == 'core'
        run: |
          ANN=firebird.cloudnative-firebird.io/fencedInstances
          kubectl wait pod/test-cluster-1 -n default --for=condition=Ready --timeout=300s
          kubectl annotate firebirdcluster test-cluster "$ANN=[\"test-cluster-1\"]" --overwrite
          timeout 180 bash -c \
            'until kubectl get firebirdcluster test-cluster -o jsonpath={.status.fencedInstances} | grep -q test-cluster-1; do sleep 3; done'
          # a fenced instance keeps running but is not ready, and its database rejects clients
          kubectl wait pod/test-cluster-1 -n default --for=condition=Ready=false --timeout=120s
          [ "$(kubectl get pod test-cluster-1 -o jsonpath={.status.phase})" = "Running" ]
          if kubectl exec test-cluster-1 -c firebird -- bash -c \
            'echo "select 1 from rdb\$database;" | isql -q localhost:/var/lib/firebird/data/mydb.fdb' 2>&1 | grep -q shutdown; then
            echo "fenced database rejects clients"
          else
            echo "fenced database accepted a client"; exit 1
          fi
          kubectl get firebirdcluster test-cluster -o jsonpath='{.status.conditions[?(@.type=="Fenced")].message}'; echo
          # the instance is not a ready endpoint of the Service
          ready_ips=$(kubectl get endpointslices -l kubernetes.io/service-name=test-cluster \
            -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.addresses[0]}{" "}{end}')
          echo "ready endpoints: $ready_ips"
          ! echo " $ready_ips " | grep -q " $(kubectl get pod test-cluster-1 -o jsonpath={.status.podIP}) "
          [ "$(kubectl get firebirdcluster test-cluster -o jsonpath={.status.phase})" = "Running" ]

          kubectl annotate firebirdcluster test-cluster "$ANN=[]" --overwrite
          kubectl wait pod/test-cluster-1 -n default --for=condition=Ready --timeout=180s
          timeout 120 bash -c \
            'while kubectl get firebirdcluster test-cluster -o jsonpath={.status.fencedInstances} | grep -q test-cluster-1; do sleep 3; done'
          echo "fence lifted"

          # scale subresource with a label selector (HPA / VPA targets)
          kubectl get --raw /apis/firebird.cloudnative-firebird.io/v1/namespaces/default/firebirdclusters/test-cluster/scale \
            | grep -q '"selector":"app.kubernetes.io/name=firebird'

      - name: Verify a clone is admitted by the source cluster's NetworkPolicy
        if: matrix.track.id == 'extended'
        run: |
          # kind's CNI does not enforce NetworkPolicies: check the generated rule, then the clone itself
          kubectl patch firebirdcluster test-cluster --type merge \
            -p '{"spec":{"networkPolicy":{"enabled":true,"ingressFrom":[{"podSelector":{"app":"client"}}]}}}'
          timeout 90 bash -c 'until kubectl get networkpolicy test-cluster-networkpolicy >/dev/null 2>&1; do sleep 3; done'
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdCluster
          metadata:
            name: copy
          spec:
            instances: 1
            storage:
              size: 1Gi
            bootstrap:
              clone:
                sourceCluster: test-cluster
          EOF
          timeout 90 bash -c 'until kubectl get networkpolicy test-cluster-networkpolicy -o json \
            | jq -e ".spec.ingress[] | select(any(.from[]?; .podSelector.matchLabels[\"firebird.cloudnative-firebird.io/cluster\"] == \"copy\" and .namespaceSelector.matchLabels[\"kubernetes.io/metadata.name\"] == \"default\"))" >/dev/null; do sleep 3; done' \
            || { kubectl get networkpolicy test-cluster-networkpolicy -o yaml; exit 1; }
          kubectl get networkpolicy test-cluster-networkpolicy -o jsonpath='{.spec.ingress}'; echo
          timeout 300 bash -c 'until kubectl get pod copy-0 >/dev/null 2>&1; do sleep 3; done'
          kubectl wait pod/copy-0 --for=condition=Ready --timeout=300s
          kubectl logs copy-0 -c bootstrap-clone | tee /tmp/clone.log
          grep -q 'cloned ' /tmp/clone.log
          kubectl delete firebirdcluster copy --wait=true
          # the later steps run without a NetworkPolicy
          kubectl patch firebirdcluster test-cluster --type merge -p '{"spec":{"networkPolicy":null}}'
          timeout 90 bash -c 'while kubectl get networkpolicy test-cluster-networkpolicy >/dev/null 2>&1; do sleep 3; done'

      - name: Verify security contexts
        # the backup Job of the core track
        if: matrix.track.id == 'core'
        run: |
          [ "$(kubectl get pod repl-0 -o jsonpath='{.spec.securityContext.seccompProfile.type}')" = RuntimeDefault ]
          kubectl get pod repl-0 -o jsonpath='{.spec.containers[0].securityContext}' | tee /dev/stderr | grep -q '"drop":\["ALL"\]'
          # operator Jobs meet the restricted Pod Security Standard
          kubectl create namespace pss-restricted
          kubectl label namespace pss-restricted pod-security.kubernetes.io/enforce=restricted
          timeout 60 bash -c 'until kubectl get serviceaccount default -n pss-restricted >/dev/null 2>&1; do sleep 2; done'
          kubectl get job backup-repl-logical -o json \
            | jq '{apiVersion: "v1", kind: "Pod", metadata: {name: "restricted-check", namespace: "pss-restricted"}, spec: .spec.template.spec}' \
            | kubectl apply --dry-run=server -f -
          kubectl delete namespace pss-restricted --wait=false

      - name: Verify segment TLS
        if: matrix.track.id == 'extended'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          sql() { kubectl exec "$1" -c firebird -- bash -c "echo \"$2\" | isql -q localhost:$DB" 2>&1; }
          count() { sql "$1" 'select count(*) from app;' | awk '$1 ~ /^[0-9]+$/ { print $1 }'; }
          wait_count() {
            for n in $(seq 1 36); do [ "$(count "$1")" = "$2" ] && return 0; sleep 5; done
            echo "$1 has $(count "$1") rows, expected $2"; return 1
          }
          SEL=firebird.cloudnative-firebird.io/cluster=repl,app.kubernetes.io/component=database
          primary=$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})
          replicas=$(for pod in repl-0 repl-1 repl-2; do [ "$pod" = "$primary" ] || echo "$pod"; done)
          replica=$(echo "$replicas" | head -1)
          # supervised: the rolling update restarts the replicas with the proxy and leaves the
          # primary plain until it is let go below, so the mixed mode can be checked
          kubectl patch firebirdcluster repl --type merge -p '{"spec":{"segmentTLS":{"enabled":true},"primaryUpdateStrategy":"supervised"}}'
          # the operator creates the cluster's CA and certificate
          timeout 60 bash -c 'until kubectl get secret repl-segment-tls >/dev/null 2>&1; do sleep 2; done'
          [ "$(kubectl get secret repl-segment-tls -o jsonpath={.type})" = kubernetes.io/tls ]
          [ -n "$(kubectl get secret repl-segment-tls -o jsonpath='{.data.ca\.key}')" ]
          tls_ready() {
            kubectl get pods -l "$SEL" \
              -o jsonpath='{range .items[*]}{.spec.initContainers[0].name} {.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              | grep -c '^segment-tls True$'
          }
          for n in $(seq 1 180); do [ "$(tls_ready)" = 2 ] && break; sleep 5; done
          [ "$(tls_ready)" = 2 ] || { kubectl get firebirdcluster repl -o jsonpath='{.status.rollingUpdate}'; echo; kubectl get pods -l "$SEL"; exit 1; }
          [ "$(kubectl get pod "$primary" -o jsonpath='{.spec.initContainers[0].name}')" != segment-tls ]
          # the operator publishes the plain primary for the proxies
          kubectl get configmap repl-segment-tls-peers -o jsonpath='{.data.plain-peers}' | tee /dev/stderr | grep -qx "$primary"

          # mixed mode: the TLS replicas pull from the plain primary, without waiting for its restart
          before=$(count "$primary")
          for i in $(seq 401 405); do sql "$primary" "insert into app values ($i, 'mixed'); commit;" >/dev/null; done
          for pod in $replicas; do wait_count "$pod" $((before + 5)); done
          echo "replicas running the proxy kept replicating from the plain primary"
          # ... and a plain client (the primary, no proxy yet) still reaches a replica's proxy
          kubectl exec "$primary" -c segment-server -- perl /etc/firebird-operator/segment-request.pl "$replica.repl-headless" PING | tee /tmp/mixed-ping.txt
          grep -q '^OK' /tmp/mixed-ping.txt

          # the primary is let go and restarts last
          kubectl patch firebirdcluster repl --type merge -p '{"spec":{"primaryUpdateStrategy":"unsupervised"}}'
          for n in $(seq 1 180); do [ "$(tls_ready)" = 3 ] && break; sleep 5; done
          [ "$(tls_ready)" = 3 ] || { kubectl get firebirdcluster repl -o jsonpath='{.status.rollingUpdate}'; echo; kubectl get pods -l "$SEL"; exit 1; }
          timeout 180 bash -c 'until [ "$(kubectl get firebirdcluster repl -o jsonpath={.status.phase})" = "Running" ] &&
            [ -z "$(kubectl get firebirdcluster repl -o jsonpath={.status.rollingUpdate})" ]; do sleep 5; done'
          primary=$(kubectl get lease repl-lease -o jsonpath={.spec.holderIdentity})
          replicas=$(for pod in repl-0 repl-1 repl-2; do [ "$pod" = "$primary" ] || echo "$pod"; done)
          replica=$(echo "$replicas" | head -1)
          kubectl logs "$primary" -c segment-tls | grep -q 'accepting on 0.0.0.0:3051'
          # the segment server listens on localhost only, behind the proxy
          kubectl logs "$primary" -c segment-server | grep -q 'listening on 127.0.0.1:3061'
          timeout 120 bash -c 'until [ -z "$(kubectl get configmap repl-segment-tls-peers -o jsonpath={.data.plain-peers})" ]; do sleep 5; done'

          # replication flows over TLS
          before=$(count "$primary")
          for i in $(seq 406 410); do sql "$primary" "insert into app values ($i, 'over tls'); commit;" >/dev/null; done
          for pod in $replicas; do wait_count "$pod" $((before + 5)); done
          echo "replicas applied the rows shipped over TLS"
          # the operator reaches the segment servers over TLS too: the lag is measured again
          timeout 120 bash -c "until [ \"\$(kubectl get pod $replica -o jsonpath='{.metadata.annotations.firebird\\.cloudnative-firebird\\.io/replication-lag-seconds}')\" = 0 ]; do sleep 5; done" \
            || { kubectl get firebirdcluster repl -o jsonpath='{.status.replicationStatus}'; exit 1; }
          # a signed request through the proxy is answered
          kubectl exec "$replica" -c segment-server -- perl /etc/firebird-operator/segment-request.pl "$primary.repl-headless" PING | tee /tmp/tls-ping.txt
          grep -q '^OK' /tmp/tls-ping.txt

          # Jobs reach the instances through their own proxy, and still meet the restricted Pod Security Standard
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdBackup
          metadata:
            name: repl-tls
          spec:
            clusterName: repl
            type: physical
            level: 0
          EOF
          for n in $(seq 1 60); do
            phase=$(kubectl get firebirdbackup repl-tls -o jsonpath='{.status.phase}')
            [ "$phase" = Completed ] || [ "$phase" = Failed ] && break
            sleep 5
          done
          [ "$phase" = Completed ] || { kubectl get firebirdbackup repl-tls -o yaml; kubectl logs job/backup-repl-tls --all-containers || true; exit 1; }
          [ "$(kubectl get job backup-repl-tls -o jsonpath='{.spec.template.spec.initContainers[0].name}')" = segment-tls ]
          kubectl create namespace pss-restricted-tls
          kubectl label namespace pss-restricted-tls pod-security.kubernetes.io/enforce=restricted
          timeout 60 bash -c 'until kubectl get serviceaccount default -n pss-restricted-tls >/dev/null 2>&1; do sleep 2; done'
          kubectl get job backup-repl-tls -o json \
            | jq '{apiVersion: "v1", kind: "Pod", metadata: {name: "restricted-check", namespace: "pss-restricted-tls"}, spec: .spec.template.spec}' \
            | kubectl apply --dry-run=server -f -
          kubectl delete namespace pss-restricted-tls --wait=false

          # once the switch's grace period is over, a request in plain text is refused
          until_ms=$(kubectl get configmap repl-segment-tls-peers -o jsonpath='{.data.accept-plain-until}')
          while [ "$(date +%s%3N)" -lt $((until_ms + 15000)) ]; do sleep 10; done
          if kubectl exec "$replica" -c segment-server -- env -u SEGMENT_PROXY \
              perl /etc/firebird-operator/segment-request.pl "$primary.repl-headless" PING 2>&1 | grep -q '^OK'; then
            echo "the segment server answered a plain connection"; exit 1
          fi
          echo "plain connections are refused"

      - name: Verify moving a pinned cluster to segment TLS
        if: matrix.track.id == 'extended'
        run: |
          # a cluster as an upgrade from before v0.77.0 leaves it: pinned to plain segment shipping
          # by the operator (the annotation tells it from an owner's choice)
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdCluster
          metadata:
            name: mig
            annotations:
              firebird.cloudnative-firebird.io/segment-tls-migration: pinned
          spec:
            instances: 1
            storage:
              size: 1Gi
            segmentTLS:
              enabled: false
          EOF
          timeout 300 bash -c 'until kubectl get pod mig-0 >/dev/null 2>&1; do sleep 3; done'
          kubectl wait pod/mig-0 --for=condition=Ready --timeout=300s
          [ "$(kubectl get pod mig-0 -o jsonpath='{.spec.initContainers[*].name}')" != segment-tls ]
          # the repl cluster (explicitly false before, true now) is never touched: it has no annotation
          kubectl set env deployment/cloudnative-firebird-operator -n cloudnative-firebird-system SEGMENT_TLS_MIGRATE=pinned
          kubectl rollout status deployment/cloudnative-firebird-operator -n cloudnative-firebird-system --timeout=180s
          annotation() { kubectl get firebirdcluster mig -o jsonpath='{.metadata.annotations.firebird\.cloudnative-firebird\.io/segment-tls-migration}'; }
          timeout 600 bash -c "until [ \"\$(kubectl get firebirdcluster mig -o jsonpath='{.metadata.annotations.firebird\\.cloudnative-firebird\\.io/segment-tls-migration}')\" = done ]; do sleep 5; done" \
            || { annotation; echo; kubectl get firebirdcluster mig -o jsonpath='{.status}'; echo; kubectl get pods -l firebird.cloudnative-firebird.io/cluster=mig; exit 1; }
          [ "$(kubectl get firebirdcluster mig -o jsonpath={.spec.segmentTLS.enabled})" = true ]
          [ "$(kubectl get pod mig-0 -o jsonpath='{.spec.initContainers[0].name}')" = segment-tls ]
          kubectl wait pod/mig-0 --for=condition=Ready --timeout=300s
          reasons=$(kubectl get events --field-selector involvedObject.name=mig -o jsonpath='{range .items[*]}{.reason}{"\n"}{end}')
          echo "$reasons" | grep -qx SegmentTLSMigrationStarted
          echo "$reasons" | grep -qx SegmentTLSMigrated
          kubectl delete firebirdcluster mig --wait=false

      - name: Verify moving a pinned cluster to the primary Lease
        if: matrix.track.id == 'extended'
        run: |
          # a cluster as an upgrade from before v0.87.0 leaves it: pinned to the operator-moved
          # Lease (the annotation), with automatic failover
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdCluster
          metadata:
            name: lmig
            annotations:
              firebird.cloudnative-firebird.io/primary-lease: pinned
          spec:
            instances: 2
            storage:
              size: 1Gi
            replication:
              enabled: true
              failover:
                enabled: true
          EOF
          timeout 300 bash -c 'until kubectl get pod lmig-1 >/dev/null 2>&1; do sleep 3; done'
          kubectl wait pod/lmig-0 pod/lmig-1 --for=condition=Ready --timeout=600s
          ! kubectl get pod lmig-0 -o jsonpath='{.spec.initContainers[*].name}' | grep -q lease-holder
          ! kubectl get role lmig-primary-lease >/dev/null 2>&1
          kubectl set env deployment/cloudnative-firebird-operator -n cloudnative-firebird-system PRIMARY_LEASE_MIGRATE=pinned
          kubectl rollout status deployment/cloudnative-firebird-operator -n cloudnative-firebird-system --timeout=180s
          annotation() { kubectl get firebirdcluster lmig -o jsonpath='{.metadata.annotations.firebird\.cloudnative-firebird\.io/primary-lease}'; }
          timeout 600 bash -c "until [ \"\$(kubectl get firebirdcluster lmig -o jsonpath='{.metadata.annotations.firebird\\.cloudnative-firebird\\.io/primary-lease}')\" = done ]; do sleep 5; done" \
            || { annotation; echo; kubectl get firebirdcluster lmig -o jsonpath='{.status}'; echo; kubectl get pods -l firebird.cloudnative-firebird.io/cluster=lmig; exit 1; }
          for pod in lmig-0 lmig-1; do kubectl get pod $pod -o jsonpath='{.spec.initContainers[*].name}' | grep -q lease-holder; done
          kubectl wait pod/lmig-0 pod/lmig-1 --for=condition=Ready --timeout=300s
          kubectl get role/lmig-primary-lease rolebinding/lmig-primary-lease
          primary=$(kubectl get lease lmig-lease -o jsonpath={.spec.holderIdentity})
          timeout 120 bash -c "until kubectl logs $primary -c lease-holder | grep -q 'holding the Lease'; do sleep 5; done"
          reasons=$(kubectl get events --field-selector involvedObject.name=lmig -o jsonpath='{range .items[*]}{.reason}{"\n"}{end}')
          echo "$reasons" | grep -qx PrimaryLeaseMigrationStarted
          echo "$reasons" | grep -qx PrimaryLeaseMigrated
          kubectl set env deployment/cloudnative-firebird-operator -n cloudnative-firebird-system PRIMARY_LEASE_MIGRATE-
          kubectl rollout status deployment/cloudnative-firebird-operator -n cloudnative-firebird-system --timeout=180s
          kubectl delete firebirdcluster lmig --wait=false

      - name: Verify a major version upgrade (Firebird 5 to 6)
        # the Firebird 6 snapshot run only: an upgrade to a development build stays experimental
        if: matrix.track.id == 'extended' && matrix.firebird.image == 'firebirdsql/firebird:6-snapshot'
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdCluster
          metadata:
            name: mup
          spec:
            instances: 2
            imageName: firebirdsql/firebird:5
            storage:
              size: 1Gi
            replication:
              enabled: true
              failover:
                enabled: true
          EOF
          timeout 300 bash -c 'until kubectl get pod mup-1 >/dev/null 2>&1; do sleep 3; done'
          kubectl wait pod/mup-0 pod/mup-1 --for=condition=Ready --timeout=600s
          DB=/var/lib/firebird/data/mydb.fdb
          sql() { kubectl exec "$1" -c firebird -- bash -c "echo \"$2\" | isql -q localhost:$DB"; }
          primary=$(kubectl get lease mup-lease -o jsonpath={.spec.holderIdentity})
          sql "$primary" "create table upgraded (id int primary key, s varchar(20)); commit; insert into upgraded values (1, 'before'); commit; create user upgrader password 'Upgr4de'; commit;"
          ods() { kubectl exec "$1" -c firebird -- gstat -h "$DB" | sed -n 's/^[[:space:]]*ODS version[[:space:]]*\([0-9.]*\).*/\1/p'; }
          [ "$(ods "$primary")" = 13.1 ]
          # the new image goes through the check first, then a major upgrade: every instance stops,
          # a Job per volume converts the databases, the instances start on Firebird 6
          kubectl patch firebirdcluster mup --type merge -p '{"spec":{"imageName":"firebirdsql/firebird:6-snapshot"}}'
          phase() { kubectl get firebirdcluster mup -o jsonpath='{.status.majorUpgrade.phase}'; }
          timeout 900 bash -c "until [ \"\$(kubectl get firebirdcluster mup -o jsonpath='{.status.majorUpgrade.phase}')\" = Completed ]; do sleep 5; done" \
            || { phase; echo; kubectl get firebirdcluster mup -o jsonpath='{.status}'; echo; kubectl get pods,jobs -l firebird.cloudnative-firebird.io/cluster=mup
                 for j in $(kubectl get jobs -l app.kubernetes.io/component=major-upgrade -o name); do kubectl logs "$j" --all-containers; done; exit 1; }
          kubectl get firebirdcluster mup -o jsonpath='{.status.majorUpgrade}'; echo
          reasons=$(kubectl get events --field-selector involvedObject.name=mup -o jsonpath='{range .items[*]}{.reason}{"\n"}{end}')
          for reason in ImageCheckStarted ImageChecked MajorUpgradeStarted MajorUpgradeConverting MajorUpgradeStarting MajorUpgradeCompleted; do
            echo "$reasons" | grep -qx "$reason" || { echo "no $reason event"; echo "$reasons"; exit 1; }
          done
          kubectl wait pod/mup-0 pod/mup-1 --for=condition=Ready --timeout=300s
          for pod in mup-0 mup-1; do
            [ "$(kubectl get pod $pod -o jsonpath='{.spec.containers[?(@.name=="firebird")].image}')" = firebirdsql/firebird:6-snapshot ]
            [ "$(ods $pod)" = 14.0 ]
          done
          primary=$(kubectl get lease mup-lease -o jsonpath={.spec.holderIdentity})
          replica=mup-0; [ "$primary" = mup-0 ] && replica=mup-1
          # the data, the user and replication all came through
          sql "$primary" "select 'rows=' || count(*) from upgraded;" | grep -q 'rows=1'
          kubectl exec "$primary" -c firebird -- bash -c "echo 'select current_user from rdb\$database;' | isql -q -u upgrader -p Upgr4de localhost:$DB" | grep -q UPGRADER
          sql "$primary" "insert into upgraded values (2, 'after'); commit;"
          timeout 180 bash -c "until kubectl exec $replica -c firebird -- bash -c \"echo \\\"select 'rows=' || count(*) from upgraded;\\\" | isql -q localhost:$DB\" | grep -q 'rows=2'; do sleep 5; done"
          # back to Firebird 5 is refused: the instances keep Firebird 6
          kubectl patch firebirdcluster mup --type merge -p '{"spec":{"imageName":"firebirdsql/firebird:5"}}'
          timeout 300 bash -c "until [ \"\$(kubectl get firebirdcluster mup -o jsonpath='{.status.imageCheck.phase}')\" = Refused ]; do sleep 5; done" \
            || { kubectl get firebirdcluster mup -o jsonpath='{.status}'; exit 1; }
          kubectl get events --field-selector reason=ImageRefused,involvedObject.name=mup -o name | grep -q .
          [ "$(kubectl get statefulset mup -o jsonpath='{.spec.template.spec.containers[?(@.name=="firebird")].image}')" = firebirdsql/firebird:6-snapshot ]
          kubectl delete firebirdcluster mup --wait=false

      - name: Verify spreading the instances
        if: matrix.track.id == 'extended'
        run: |
          # clusters created by this operator repel their instances: preferred, on the hostname
          [ "$(kubectl get firebirdcluster test-cluster -o jsonpath='{.metadata.annotations.firebird\.cloudnative-firebird\.io/pod-anti-affinity}')" = enabled ]
          [ "$(kubectl get statefulset test-cluster -o jsonpath='{.spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey}')" = kubernetes.io/hostname ]
          # required, with a spread constraint: kind has one node, so the second instance stays pending
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdCluster
          metadata:
            name: spread
          spec:
            instances: 2
            storage:
              size: 1Gi
            podAntiAffinity:
              type: required
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
          EOF
          timeout 300 bash -c 'until kubectl get pod spread-0 >/dev/null 2>&1; do sleep 3; done'
          kubectl wait pod/spread-0 --for=condition=Ready --timeout=300s
          timeout 180 bash -c 'until [ "$(kubectl get pod spread-1 -o jsonpath="{.status.conditions[?(@.type==\"PodScheduled\")].reason}" 2>/dev/null)" = Unschedulable ]; do sleep 3; done' \
            || { kubectl get pod spread-1 -o yaml; exit 1; }
          kubectl get statefulset spread -o jsonpath='{.spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels}' | grep -q '"firebird.cloudnative-firebird.io/cluster":"spread"'
          kubectl get statefulset spread -o jsonpath='{.spec.template.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey}' | grep -qx kubernetes.io/hostname
          # back to preferred: the rolling update recreates the pod no node took, which then starts
          kubectl patch firebirdcluster spread --type merge -p '{"spec":{"podAntiAffinity":{"type":"preferred"}}}'
          timeout 300 bash -c 'until [ "$(kubectl get pod spread-1 -o jsonpath="{.status.conditions[?(@.type==\"Ready\")].status}" 2>/dev/null)" = True ]; do sleep 5; done' \
            || { kubectl get pods -l firebird.cloudnative-firebird.io/cluster=spread -L controller-revision-hash; kubectl get firebirdcluster spread -o jsonpath='{.status}'; echo
                 kubectl get pod spread-1 -o jsonpath='{.status.conditions}'; echo; kubectl get events --field-selector involvedObject.name=spread-1; exit 1; }
          kubectl get statefulset spread -o jsonpath='{.spec.template.spec.affinity.podAntiAffinity}' | grep -q preferredDuringScheduling
          kubectl delete firebirdcluster spread --wait=false

      - name: Verify refusing plain segment shipping
        if: matrix.track.id == 'extended'
        run: |
          # a cluster still plain (as an upgrade from before v0.77.0 leaves it), before the setting
          kubectl apply -f - <<'EOF'
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdCluster
          metadata:
            name: plain
          spec:
            instances: 1
            storage:
              size: 1Gi
            segmentTLS:
              enabled: false
          EOF
          timeout 300 bash -c 'until kubectl get pod plain-0 >/dev/null 2>&1; do sleep 3; done'
          kubectl wait pod/plain-0 --for=condition=Ready --timeout=300s
          kubectl set env deployment/cloudnative-firebird-operator -n cloudnative-firebird-system SEGMENT_TLS_REQUIRED=true
          kubectl rollout status deployment/cloudnative-firebird-operator -n cloudnative-firebird-system --timeout=180s
          # the admission webhook is served by every replica: wait until the old ones, without the
          # new setting, are gone too (a terminating pod can still answer for a few seconds)
          timeout 120 bash -c 'until [ -z "$(kubectl get pods -n cloudnative-firebird-system -l app.kubernetes.io/name=cloudnative-firebird -o jsonpath="{range .items[*]}{.metadata.deletionTimestamp}{end}")" ]; do sleep 3; done'
          # the plain cluster is reported, not restarted (the new leader reconciles it after the rollout)
          echo "waiting for the SegmentTLS condition"
          timeout 180 bash -c 'until [ "$(kubectl get firebirdcluster plain -o jsonpath="{.status.conditions[?(@.type==\"SegmentTLS\")].reason}")" = PlainSegmentShipping ]; do sleep 5; done' \
            || { kubectl get firebirdcluster plain -o jsonpath='{.status.conditions}'; exit 1; }
          echo "waiting for the SegmentTLSRequired event"
          timeout 120 bash -c 'until kubectl get events --field-selector reason=SegmentTLSRequired,involvedObject.name=plain -o name | grep -q .; do sleep 5; done' \
            || { kubectl get events --field-selector involvedObject.name=plain; exit 1; }
          [ "$(kubectl get pod plain-0 -o jsonpath='{.spec.initContainers[*].name}')" != segment-tls ]
          [ "$(kubectl get firebirdcluster plain -o jsonpath={.spec.segmentTLS.enabled})" = false ]
          # the metric, on the leader once it has reconciled both clusters (the Lease may still name
          # the old leader for a moment after the rollout)
          echo "waiting for firebird_cluster_segment_tls on the leader"
          leader_metrics() {
            OP=$(kubectl get lease cloudnative-firebird-operator -n cloudnative-firebird-system -o jsonpath={.spec.holderIdentity})
            kubectl get --raw "/api/v1/namespaces/cloudnative-firebird-system/pods/$OP:8080/proxy/metrics" 2>/dev/null
          }
          for n in $(seq 1 36); do
            leader_metrics > /tmp/metrics-tls.txt || true
            grep -q '^firebird_cluster_segment_tls{namespace="default",cluster="plain"} 0$' /tmp/metrics-tls.txt &&
              grep -q '^firebird_cluster_segment_tls{namespace="default",cluster="repl"} 1$' /tmp/metrics-tls.txt && break
            sleep 5
          done
          grep '^firebird_cluster_segment_tls' /tmp/metrics-tls.txt
          grep -q '^firebird_cluster_segment_tls{namespace="default",cluster="plain"} 0$' /tmp/metrics-tls.txt
          grep -q '^firebird_cluster_segment_tls{namespace="default",cluster="repl"} 1$' /tmp/metrics-tls.txt
          echo "checking admission"
          # admission: no new plain cluster, no switching one off; the plain one may still change
          if kubectl apply -f - <<'EOF' 2>/tmp/denied.txt
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdCluster
          metadata:
            name: plain-new
          spec:
            instances: 1
            storage:
              size: 1Gi
            segmentTLS:
              enabled: false
          EOF
          then echo "a plain cluster was admitted"; exit 1; fi
          grep -q 'requires segment TLS' /tmp/denied.txt
          if kubectl patch firebirdcluster repl --type merge -p '{"spec":{"segmentTLS":{"enabled":false}}}' 2>/tmp/denied.txt; then
            echo "switching segment TLS off was admitted"; exit 1
          fi
          grep -q 'requires segment TLS' /tmp/denied.txt
          kubectl patch firebirdcluster plain --type merge -p '{"spec":{"env":[{"name":"STILL_PLAIN","value":"1"}]}}'
          kubectl set env deployment/cloudnative-firebird-operator -n cloudnative-firebird-system SEGMENT_TLS_REQUIRED-
          kubectl rollout status deployment/cloudnative-firebird-operator -n cloudnative-firebird-system --timeout=180s
          # the admission webhook is served by every replica: wait until the old ones, without the
          # new setting, are gone too (a terminating pod can still answer for a few seconds)
          timeout 120 bash -c 'until [ -z "$(kubectl get pods -n cloudnative-firebird-system -l app.kubernetes.io/name=cloudnative-firebird -o jsonpath="{range .items[*]}{.metadata.deletionTimestamp}{end}")" ]; do sleep 3; done'
          kubectl delete firebirdcluster plain --wait=false

      - name: Verify synchronous replication
        if: matrix.track.id == 'extended'
        run: |
          DB=/var/lib/firebird/data/mydb.fdb
          sql() { kubectl exec "$1" -c firebird -- bash -c "echo \"$2\" | isql -q localhost:$DB" 2>&1; }
          count() { sql "$1" 'select count(*) from app;' | awk '$1 ~ /^[0-9]+$/ { print $1 }'; }
          sync_state() { kubectl get firebirdcluster sync -o jsonpath='{.status.synchronous.phase} {.status.synchronous.primary} {.status.synchronous.standby}'; }
          wait_attached() {
            timeout 600 bash -c "until [ \"\$(kubectl get firebirdcluster sync -o jsonpath='{.status.synchronous.phase} {.status.synchronous.primary}')\" = 'Attached $1' ]; do sleep 5; done" \
              || { sync_state; echo; kubectl get firebirdcluster sync -o jsonpath='{.status.synchronous.message}'; echo; kubectl logs job/sync-sync-standby || true; exit 1; }
          }
          cat <<'EOF' | kubectl apply -f -
          apiVersion: firebird.cloudnative-firebird.io/v1
          kind: FirebirdCluster
          metadata:
            name: sync
          spec:
            instances: 2
            # as the firebird user (restricted Pod Security Standard), through the whole step
            runAsFirebirdUser: true
            storage:
              size: 1Gi
            bootstrap:
              initSql: |
                CREATE TABLE app (id INTEGER PRIMARY KEY, note VARCHAR(40));
                COMMIT;
            replication:
              enabled: true
              mode: sync
              archiveTimeoutSeconds: 5
              failover:
                enabled: true
                delaySeconds: 20
          EOF
          kubectl wait pod/sync-0 pod/sync-1 --for=condition=Ready --timeout=600s 2>/dev/null \
            || { timeout 300 bash -c 'until kubectl get pod sync-1 >/dev/null 2>&1; do sleep 3; done'; kubectl wait pod/sync-0 pod/sync-1 --for=condition=Ready --timeout=600s; }
          if [ "${{ matrix.firebird.image }}" = "firebirdsql/firebird:4" ]; then
            # Firebird 4 commits while a sync_replica is unreachable: refused, replicating asynchronously
            timeout 300 bash -c 'until kubectl get firebirdcluster sync -o jsonpath={.status.synchronous.message} | grep -q "Firebird 4"; do sleep 5; done' \
              || { kubectl get firebirdcluster sync -o jsonpath='{.status.synchronous}'; echo; exit 1; }
            kubectl get firebirdcluster sync -o jsonpath='{.status.synchronous.message}'; echo
            [ -z "$(kubectl get firebirdcluster sync -o jsonpath='{.status.synchronous.standbys[*]}')" ]
            ! kubectl get job sync-sync-standby >/dev/null 2>&1
            kubectl delete firebirdcluster sync --wait=false
            exit 0
          fi
          wait_attached sync-0
          sync_state; echo
          # every instance container runs as uid 84 and the pod meets the restricted standard
          [ "$(kubectl exec sync-0 -c firebird -- id -u)" = 84 ]
          [ "$(kubectl exec sync-0 -c firebird -- sh -c 'stat -c %u /proc/$(pgrep -x firebird | head -n 1)')" = 84 ]
          kubectl create namespace pss-sync
          kubectl label namespace pss-sync pod-security.kubernetes.io/enforce=restricted
          timeout 60 bash -c 'until kubectl get serviceaccount default -n pss-sync >/dev/null 2>&1; do sleep 2; done'
          kubectl get pod sync-0 -o json \
            | jq '{apiVersion: "v1", kind: "Pod", metadata: {name: "restricted-check", namespace: "pss-sync"}, spec: (.spec | del(.nodeName, .serviceAccountName, .serviceAccount))}' \
            | kubectl apply --dry-run=server -f -
          kubectl delete namespace pss-sync --wait=false
          kubectl logs job/sync-sync-standby | tail -5 || true
          # every commit is on the standby when it returns
          for i in 1 2 3; do
            sql sync-0 "insert into app values ($i, 'sync'); commit;" >/dev/null
            [ "$(sql sync-1 "select count(*) from app where id = $i;" | awk '$1 ~ /^[0-9]+$/ { print $1 }')" = 1 ] \
              || { echo "row $i is not on the standby right after its commit"; exit 1; }
          done
          echo "commits are applied on the standby synchronously"
          # the standby does not apply the journal as well: nothing twice, after segments shipped
          sleep 15
          [ "$(count sync-1)" = 3 ] || { echo "the standby has $(count sync-1) rows, expected 3"; exit 1; }
          # failover: the standby is promoted without an election and has every committed row
          for i in $(seq 10 19); do sql sync-0 "insert into app values ($i, 'before failover'); commit;" >/dev/null; done
          kubectl exec sync-0 -c firebird -- bash -c \
            "fbsvcmgr localhost:service_mgr action_properties dbname $DB prp_shutdown_mode prp_sm_full prp_force_shutdown 0"
          timeout 600 bash -c \
            'until kubectl get firebirdcluster sync -o jsonpath="{.status.switchover.kind} {.status.switchover.phase}" | grep -q "failover Completed"; do
               kubectl get firebirdcluster sync -o jsonpath="{.status.switchover.kind} {.status.switchover.phase}" | grep -q "failover Failed" && exit 1; sleep 5; done' \
            || { kubectl get firebirdcluster sync -o jsonpath='{.status.switchover}'; echo; exit 1; }
          kubectl get firebirdcluster sync -o jsonpath='{.status.switchover.message}'; echo
          # promoted without an election (the Promoting event of the failover says so)
          kubectl get events --field-selector involvedObject.name=sync -o jsonpath='{range .items[*]}{.message}{"\n"}{end}' \
            | tee /dev/stderr | grep -q 'promoting the synchronous standby sync-1'
          ! kubectl get events --field-selector involvedObject.name=sync -o jsonpath='{range .items[*]}{.reason}{"\n"}{end}' | grep -q FailoverStarted
          [ "$(kubectl get lease sync-lease -o jsonpath={.spec.holderIdentity})" = "sync-1" ]
          # the standby was promoted in place (no restart)
          [ "$(kubectl get firebirdcluster sync -o jsonpath={.status.switchover.promotedInPlace})" = "true" ]
          [ "$(count sync-1)" = 13 ] || { echo "the new primary has $(count sync-1) rows, expected 13"; exit 1; }
          echo "failed over to the synchronous standby without losing a transaction"
          # the old primary returns re-seeded and becomes the standby of the new one
          timeout 300 bash -c "until kubectl get pod sync-0 >/dev/null 2>&1; do sleep 3; done"
          kubectl wait pod/sync-0 --for=condition=Ready --timeout=300s
          wait_attached sync-1
          sql sync-1 "insert into app values (100, 'new standby'); commit;" >/dev/null
          [ "$(sql sync-0 'select count(*) from app where id = 100;' | awk '$1 ~ /^[0-9]+$/ { print $1 }')" = 1 ]
          [ "$(count sync-0)" = 14 ] || { echo "the new standby has $(count sync-0) rows, expected 14"; exit 1; }
          echo "sync-0 is the synchronous standby of sync-1"
          # rolling update with dataDurability required and detachForUpdates: the only standby is
          # detached before its restart (writes continue meanwhile, asynchronously), then attached
          # again; the primary goes last
          kubectl patch firebirdcluster sync --type merge \
            -p '{"spec":{"env":[{"name":"ROLLING_UPDATE_TEST","value":"1"}],"replication":{"synchronous":{"detachForUpdates":true}}}}'
          timeout 120 bash -c 'until kubectl get statefulset sync -o jsonpath={.spec.template.spec.containers[0].env} | grep -q ROLLING_UPDATE_TEST &&
            [ "$(kubectl get statefulset sync -o jsonpath={.status.observedGeneration})" = "$(kubectl get statefulset sync -o jsonpath={.metadata.generation})" ]; do sleep 3; done'
          rev=$(kubectl get statefulset sync -o jsonpath={.status.updateRevision})
          SEL=firebird.cloudnative-firebird.io/cluster=sync,app.kubernetes.io/component=database
          # while the standby restarts, a commit on the primary goes through (required alone would
          # fail it with a replication error until the standby is back)
          timeout 300 bash -c 'until [ "$(kubectl get pod sync-0 -o jsonpath="{.status.conditions[?(@.type==\"Ready\")].status}" 2>/dev/null)" != True ]; do sleep 1; done'
          out=$(timeout 60 kubectl exec sync-1 -c firebird -- bash -c "echo \"insert into app values (150, 'during restart'); commit;\" | isql -q localhost:$DB" 2>&1) || true
          echo "$out"
          if echo "$out" | grep -qi 'error'; then echo "a commit failed while the standby restarted"; exit 1; fi
          updated() {
            kubectl get pods -l "$SEL" \
              -o jsonpath='{range .items[*]}{.metadata.labels.controller-revision-hash} {.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
              | grep -c "^$rev True$"
          }
          for n in $(seq 1 120); do [ "$(updated)" = 2 ] && [ -z "$(kubectl get firebirdcluster sync -o jsonpath={.status.rollingUpdate})" ] && break; sleep 5; done
          [ "$(updated)" = 2 ] || {
            kubectl get firebirdcluster sync -o jsonpath='{.status.rollingUpdate} {.status.synchronous}'; echo
            kubectl get pods -l "$SEL" -L controller-revision-hash; exit 1
          }
          kubectl get events --field-selector involvedObject.name=sync -o jsonpath='{range .items[*]}{.message}{"\n"}{end}' \
            | grep -q 'detaching sync-0: sync-0 is restarted by the rolling update' \
            || { echo "the standby was not detached before its restart"; exit 1; }
          wait_attached sync-1
          [ "$(kubectl get lease sync-lease -o jsonpath={.spec.holderIdentity})" = "sync-1" ]
          sql sync-1 "insert into app values (101, 'after update'); commit;" >/dev/null
          [ "$(sql sync-0 'select count(*) from app where id = 101;' | awk '$1 ~ /^[0-9]+$/ { print $1 }')" = 1 ]
          # the commit made during the restart reached the standby too (journal, then attached)
          [ "$(count sync-0)" = 16 ] || { echo "the standby has $(count sync-0) rows, expected 16"; exit 1; }
          echo "rolling update detached the synchronous standby before its restart and attached it again"
          # two synchronous standbys: a third instance, synchronous.number 2
          kubectl patch firebirdcluster sync --type merge -p '{"spec":{"instances":3,"replication":{"synchronous":{"number":2}}}}'
          timeout 600 bash -c 'until [ "$(kubectl get firebirdcluster sync -o jsonpath="{.status.synchronous.phase} {.status.synchronous.standbys[*]}" | wc -w)" = 3 ] &&
            kubectl get firebirdcluster sync -o jsonpath="{.status.synchronous.phase}" | grep -q "^Attached$"; do sleep 5; done' \
            || { kubectl get firebirdcluster sync -o jsonpath='{.status.synchronous}'; echo; kubectl logs job/sync-sync-standby || true; exit 1; }
          kubectl get firebirdcluster sync -o jsonpath='{.status.synchronous.standbys}'; echo
          sql sync-1 "insert into app values (102, 'two standbys'); commit;" >/dev/null
          for pod in sync-0 sync-2; do
            [ "$(sql $pod 'select count(*) from app where id = 102;' | awk '$1 ~ /^[0-9]+$/ { print $1 }')" = 1 ] \
              || { echo "row 102 is not on $pod right after its commit"; exit 1; }
          done
          echo "every commit is applied on both synchronous standbys"
          kubectl delete firebirdcluster sync --wait=false

      - name: Verify Kubernetes events
        if: matrix.track.id == 'core'
        run: |
          kubectl get events --sort-by=.lastTimestamp \
            -o custom-columns=KIND:.involvedObject.kind,NAME:.involvedObject.name,TYPE:.type,REASON:.reason,COUNT:.count,MESSAGE:.message \
            | grep -E '^Firebird' | tee /tmp/events.txt
          expect() {
            kubectl get events --field-selector "involvedObject.kind=$1,involvedObject.name=$2,reason=$3" -o name | grep -q . \
              || { echo "missing event $3 on $1/$2"; exit 1; }
          }
          expect FirebirdCluster repl SwitchoverStarted
          expect FirebirdCluster repl SwitchoverCompleted
          expect FirebirdCluster repl PrimaryNotReady
          expect FirebirdCluster repl FailoverStarted
          expect FirebirdCluster repl FailoverCompleted
          expect FirebirdCluster repl ReseedStarted
          expect FirebirdCluster repl RollingUpdate
          expect FirebirdCluster repl RollingUpdateCompleted
          expect FirebirdCluster test-cluster InstanceFenced
          expect FirebirdCluster test-cluster InstanceUnfenced
          expect FirebirdBackup repl-logical BackupCompleted
          expect FirebirdRestore from-logical RestoreCompleted
          expect FirebirdUser app-user UserApplied

      - name: Verify operator leader election
        if: matrix.track.id == 'core'
        run: |
          NS=cloudnative-firebird-system
          SEL=app.kubernetes.io/name=cloudnative-firebird,app.kubernetes.io/component=operator
          holder() { kubectl get lease cloudnative-firebird-operator -n $NS -o jsonpath={.spec.holderIdentity}; }
          # a reconcile only the leader does: the test cluster's StatefulSet follows spec.instances
          reconciles() {
            n=$1
            kubectl patch firebirdcluster test-cluster --type merge -p "{\"spec\":{\"instances\":$n}}"
            timeout 120 bash -c "until [ \"\$(kubectl get statefulset test-cluster -o jsonpath={.spec.replicas})\" = $n ]; do sleep 3; done"
          }
          kubectl get pods -n $NS -l "$SEL" -o wide
          [ "$(kubectl get pods -n $NS -l "$SEL" --field-selector=status.phase=Running -o name | wc -l)" = 2 ]
          leader=$(holder); echo "leader: $leader"
          kubectl get pod "$leader" -n $NS
          # only the leader reconciles
          for p in $(kubectl get pods -n $NS -l "$SEL" -o jsonpath='{.items[*].metadata.name}'); do
            n=$(kubectl logs -n $NS "$p" | grep -c '"msg":"Reconciling FirebirdCluster"' || true)
            echo "$p: $n reconciles"
            if [ "$p" = "$leader" ]; then [ "$n" -gt 0 ]; else [ "$n" = 0 ]; fi
          done
          # graceful: the leader releases the Lease on shutdown, the standby takes over at once
          kubectl delete pod "$leader" -n $NS --wait=false
          timeout 30 bash -c "until h=\$(kubectl get lease cloudnative-firebird-operator -n $NS -o jsonpath={.spec.holderIdentity}) && [ -n \"\$h\" ] && [ \"\$h\" != $leader ]; do sleep 1; done"
          second=$(holder); echo "after a graceful shutdown: $second"
          reconciles 3
          # hard: the new leader is killed; the other replica takes over once the Lease expires (15 s)
          kubectl delete pod "$second" -n $NS --grace-period=0 --force
          timeout 90 bash -c "until h=\$(kubectl get lease cloudnative-firebird-operator -n $NS -o jsonpath={.spec.holderIdentity}) && [ -n \"\$h\" ] && [ \"\$h\" != $second ]; do sleep 2; done"
          echo "after a forced kill: $(holder)"
          reconciles 2
          kubectl rollout status deployment/cloudnative-firebird-operator -n $NS --timeout=120s
          [ "$(kubectl get lease cloudnative-firebird-operator -n $NS -o jsonpath={.spec.leaseTransitions})" -ge 2 ]

      - name: Verify operator reconciled without API errors
        run: |
          logs=$(kubectl logs -n cloudnative-firebird-system -l app.kubernetes.io/name=cloudnative-firebird --tail=-1)
          # 400 (patch type) / 403 (RBAC) failures surface as these messages
          if echo "$logs" | grep -E '"msg":"(Reconciliation failed|Failed to update cluster status)"'; then
            echo "Operator reported reconcile/status errors"; exit 1
          fi

      - name: Show cluster resources on failure
        if: failure()
        run: |
          echo "=== FirebirdClusters ==="
          kubectl get firebirdclusters -A || true
          echo "=== StatefulSets ==="
          kubectl get statefulsets -A || true
          echo "=== Services ==="
          kubectl get services -A || true
          echo "=== PDBs, Leases, PVCs ==="
          kubectl get pdb,lease,pvc -n default || true
          echo "=== Backups, restores and their Jobs ==="
          kubectl get firebirdbackups,firebirdrestores,firebirdscheduledbackups,firebirdusers -o yaml || true
          kubectl get jobs,cronjobs -n default || true
          for j in $(kubectl get jobs -n default -o name 2>/dev/null); do
            echo "--- $j"; kubectl logs "$j" -n default --all-containers || true
          done
          for j in repl-failover repl-switchover; do echo "--- job/$j"; kubectl logs "job/$j" || true; done
          echo "=== FirebirdCluster status ==="
          kubectl get firebirdcluster -o yaml || true
          echo "=== Instance pods ==="
          kubectl get pods -o wide || true
          echo "=== Replication init and sidecar logs ==="
          for p in repl-0 repl-1 repl-2 sync-0 sync-1; do
            kubectl get pod $p >/dev/null 2>&1 || continue
            kubectl get pod $p -o jsonpath='{range .status.initContainerStatuses[*]}{.name}: {.state}{"\n"}{end}{range .status.containerStatuses[*]}{.name}: ready={.ready} restarts={.restartCount} {.state}{"\n"}{end}' || true
            for c in replication-init segment-server segment-puller firebird; do
              echo "--- $p/$c"; kubectl logs $p -c $c --tail=30 2>/dev/null || true
            done
            kubectl exec $p -c firebird -- tail -20 /opt/firebird/replication.log 2>/dev/null || true
          done
          kubectl logs job/sync-sync-standby 2>/dev/null || true
          echo "=== Operator logs ==="
          kubectl logs -n cloudnative-firebird-system \
            -l app.kubernetes.io/name=cloudnative-firebird \
            --tail=200 || true
          echo "=== Operator pod events ==="
          kubectl get events -n cloudnative-firebird-system || true
