# expect: exactly one of journalS3, journalAzureBlob and journalGCS
apiVersion: firebird.cloudnative-firebird.io/v1
kind: FirebirdCluster
metadata:
  name: c1
spec:
  instances: 1
  storage:
    size: 1Gi
  replication:
    enabled: true
  replica:
    enabled: true
    journalS3:
      bucket: dr
    journalGCS:
      bucket: dr
  bootstrap:
    recovery:
      sourcePath: nbackup-l0-src-base.nbk
      gcs:
        bucket: backups
