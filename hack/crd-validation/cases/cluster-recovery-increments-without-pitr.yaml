# expect: incrementalPaths applies to point-in-time recovery only
apiVersion: firebird.cloudnative-firebird.io/v1
kind: FirebirdCluster
metadata:
  name: c1
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    recovery:
      sourcePath: backup.fbk
      incrementalPaths: [l1.nbk]
      s3:
        bucket: backups
