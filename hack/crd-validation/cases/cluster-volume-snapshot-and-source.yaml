# expect: bootstrap.recovery.volumeSnapshot is mutually exclusive with sourcePath, s3 and pointInTime
apiVersion: firebird.cloudnative-firebird.io/v1
kind: FirebirdCluster
metadata:
  name: c1
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    recovery:
      sourcePath: backup.fbk
      volumeSnapshot:
        name: nightly
