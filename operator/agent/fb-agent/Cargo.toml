[package]
name = "fb-agent"
description = "The instance pods' agent of cloudnative-firebird (docs/rust-agent-roadmap.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sig1 = { path = "../sig1" }
# pinned: a young crate, checked against Firebird 4, 5 and 6 (docs/rust-agent-firebird-access.md)
firebird-wire = "=0.1.16"
libc = "0.2"
signal-hook = { version = "0.3", default-features = false }
# TLS for the segment servers: rustls with the ring provider (its C and assembly parts are compiled
# by clang for the static musl targets, see the Dockerfile and the CI's Rust agent job)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
