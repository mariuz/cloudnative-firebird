[package]
name = "fb-agent"
description = "The instance pods' agent of cloudnative-firebird (docs/rust-agent-roadmap.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sig1 = { path = "../sig1" }
# pinned: a young crate, checked against Firebird 4, 5 and 6 (docs/rust-agent-firebird-access.md)
firebird-wire = "=0.1.16"
libc = "0.2"
signal-hook = { version = "0.3", default-features = false }
# TLS for the segment servers: rustls with the ring provider (its C and assembly parts are compiled
# by clang for the static musl targets, see the Dockerfile and the CI's Rust agent job)
# tls12: for the Kubernetes API server only (the lease holder); the segment servers are TLS 1.3 only
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# the Lease object of the Kubernetes API, read and written back whole by the lease holder
serde_json = "1"
# fb-agent objects (objects.rs, docs/object-stores.md): S3, Azure Blob and GCS over their own APIs.
# pinned, as firebird-wire; the *-base features with the ring provider and reqwest without one
# (rustls gets ring installed), so no aws-lc-rs for the static musl builds
object_store = { version = "=0.14.2", default-features = false, features = ["aws-base", "azure-base", "gcp-base", "ring", "reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
# object_store is async: a current-thread runtime in `objects` only
tokio = { version = "1", default-features = false, features = ["rt"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
# the Mozilla roots, so that an instance image without a CA store reaches the cloud endpoints
webpki-root-certs = "1"
