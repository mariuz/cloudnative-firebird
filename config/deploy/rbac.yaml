---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnative-firebird-operator
  labels:
    app.kubernetes.io/name: cloudnative-firebird
    app.kubernetes.io/component: operator
rules:
  # FirebirdCluster resources
  - apiGroups:
      - firebird.cloudnative-firebird.io
    resources:
      - firebirdclusters
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - firebird.cloudnative-firebird.io
    resources:
      - firebirdclusters/status
    verbs:
      - get
      - update
      - patch
  # Backup, scheduled backup and restore resources
  - apiGroups:
      - firebird.cloudnative-firebird.io
    resources:
      - firebirdbackups
      - firebirdscheduledbackups
      - firebirdrestores
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - firebird.cloudnative-firebird.io
    resources:
      - firebirdbackups/status
      - firebirdscheduledbackups/status
      - firebirdrestores/status
    verbs:
      - get
      - update
      - patch
  # StatefulSets
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Services
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # PersistentVolumeClaims
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Secrets (for superuser password)
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  # Events
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Pods (for status reporting and read-only routing labels)
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - patch
  # ConfigMaps (firebird.conf, init.sql, Grafana dashboards)
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Backup, sweep, diagnostics and journal archive CronJobs; backup/restore Jobs
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Primary leader election Lease
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # PodDisruptionBudgets
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # NetworkPolicies
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Prometheus Operator PodMonitors
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - podmonitors
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # cert-manager Certificates
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudnative-firebird-operator
  labels:
    app.kubernetes.io/name: cloudnative-firebird
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudnative-firebird-operator
subjects:
  - kind: ServiceAccount
    name: cloudnative-firebird-operator
    namespace: cloudnative-firebird-system
