apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnative-firebird-operator
  namespace: cloudnative-firebird-system
  labels:
    app.kubernetes.io/name: cloudnative-firebird
    app.kubernetes.io/component: operator
spec:
  # one replica reconciles (leader election, Lease cloudnative-firebird-operator), every replica
  # serves the admission webhook; the other takes over within about 15 seconds
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-firebird
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudnative-firebird
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: cloudnative-firebird-operator
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cloudnative-firebird
                    app.kubernetes.io/component: operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: operator
          image: ghcr.io/mariuz/cloudnative-firebird:latest
          imagePullPolicy: Always
          ports:
            # /healthz, /readyz and the Prometheus /metrics
            - name: http
              containerPort: 8080
            # validating admission webhook (config/deploy/webhook.yaml)
            - name: webhook
              containerPort: 9443
          env:
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            # Firebird image of clusters without spec.imageName (default firebirdsql/firebird:latest)
            # - name: FIREBIRD_DEFAULT_IMAGE
            #   value: firebirdsql/firebird:5
            # the admission webhook (config/deploy/webhook.yaml); "false" turns it off
            - name: WEBHOOK_ENABLED
              value: "true"
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # leader election identity; LEADER_ELECTION=false runs a single replica without it
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      terminationGracePeriodSeconds: 10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudnative-firebird-operator
  namespace: cloudnative-firebird-system
  labels:
    app.kubernetes.io/name: cloudnative-firebird
    app.kubernetes.io/component: operator
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-firebird
      app.kubernetes.io/component: operator
