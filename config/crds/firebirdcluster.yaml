apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firebirdclusters.firebird.cloudnative-firebird.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: firebird.cloudnative-firebird.io
  names:
    kind: FirebirdCluster
    listKind: FirebirdClusterList
    plural: firebirdclusters
    singular: firebirdcluster
    shortNames:
      - fb
      - fbc
    categories:
      - all
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.instances
          statusReplicasPath: .status.instances
          # lets the HorizontalPodAutoscaler / VerticalPodAutoscaler map the cluster to its pods
          labelSelectorPath: .status.selector
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Instances
          type: integer
          jsonPath: .spec.instances
        - name: Ready
          type: integer
          jsonPath: .status.readyInstances
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Image
          type: string
          jsonPath: .spec.imageName
          priority: 1
      schema:
        openAPIV3Schema:
          description: FirebirdCluster is the Schema for the firebirdclusters API
          type: object
          x-kubernetes-validations:
            - rule: >-
                !has(self.spec.bootstrap) || !has(self.spec.bootstrap.clone) ||
                self.spec.bootstrap.clone.sourceCluster != self.metadata.name
              message: bootstrap clone sourceCluster cannot be the cluster itself
          required:
            - spec
          properties:
            apiVersion:
              description: >
                APIVersion defines the versioned schema of this representation of an object.
              type: string
            kind:
              description: Kind is a string value representing the REST resource this object represents.
              type: string
            metadata:
              type: object
            spec:
              description: FirebirdClusterSpec defines the desired state of a FirebirdCluster
              type: object
              x-kubernetes-validations:
                - rule: "!has(self.bootstrap) || !has(self.bootstrap.clone) || !has(self.bootstrap.recovery)"
                  message: bootstrap recovery and clone are mutually exclusive
              required:
                - instances
                - storage
              properties:
                instances:
                  description: Number of Firebird instances to run in this cluster
                  type: integer
                  minimum: 1
                  maximum: 10
                imageName:
                  description: >
                    Full name of the Firebird Docker image to use.
                    Defaults to firebirdsql/firebird:latest
                  type: string
                superuserSecret:
                  description: Reference to the Secret containing the SYSDBA password
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      description: Name of the Secret resource
                      type: string
                      minLength: 1
                databaseName:
                  description: >
                    Database file created in each instance's data directory
                    (/var/lib/firebird/data). Defaults to "mydb.fdb".
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
                storage:
                  description: Storage configuration for Firebird data files
                  type: object
                  required:
                    - size
                  properties:
                    size:
                      description: >
                        Size of the PersistentVolumeClaim (e.g. "1Gi"). Increasing this value
                        expands existing PVCs in place (requires a StorageClass with
                        allowVolumeExpansion); shrinking is not supported.
                      type: string
                      x-kubernetes-validations:
                        - rule: isQuantity(self) && quantity(self).isGreaterThan(quantity('0'))
                          message: storage size must be a positive quantity (e.g. "10Gi")
                        - rule: "!isQuantity(oldSelf) || !isQuantity(self) || !quantity(self).isLessThan(quantity(oldSelf))"
                          message: storage size cannot be decreased (PVCs cannot shrink)
                    storageClass:
                      description: Optional StorageClass name for the PVC
                      type: string
                resources:
                  description: Resource requirements for each Firebird container
                  type: object
                  properties:
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                backup:
                  description: Backup configuration
                  type: object
                  x-kubernetes-validations:
                    - rule: "!has(self.type) || self.type != 'physical' || !has(self.s3)"
                      message: physical backups are stored in the primary's data directory; S3 upload is supported for logical backups only
                    - rule: "!has(self.verify) || !self.verify || !has(self.type) || self.type != 'physical'"
                      message: verify is supported for logical backups only
                  required:
                    - enabled
                  properties:
                    enabled:
                      description: Whether backups are enabled
                      type: boolean
                    type:
                      description: Backup strategy ('logical' via gbak or 'physical' via nbackup)
                      type: string
                      enum:
                        - logical
                        - physical
                    level:
                      description: nbackup physical backup level (0 for full base backup, 1 or 2 for incremental)
                      type: integer
                      minimum: 0
                      maximum: 2
                    schedule:
                      description: Cron schedule for backups (e.g. "0 2 * * *")
                      type: string
                      pattern: '^\s*\S+(\s+\S+){4}\s*$'
                    retentionPolicy:
                      description: >-
                        How long scheduled backups are kept: <n>d, <n>w or <n>m (30 days). Enforced for logical
                        backups to S3 (expired objects of the schedule are deleted after each upload, the newest
                        is always kept); server-side files and nbackup chains are not pruned.
                      type: string
                      pattern: '^[1-9][0-9]*[dwm]$'
                    verify:
                      description: >-
                        Restore each backup into a scratch database and validate it (gbak -c, then a full
                        validation); the backup fails when it does not restore or validate. Logical backups only.
                      type: boolean
                    target:
                      description: >-
                        Where the backup runs: primary (default) or prefer-standby, a ready, unfenced and
                        non-lagging replica when one exists (logical backups to S3 only; others use the primary)
                      type: string
                      enum: [primary, prefer-standby]
                    s3:
                      description: Cloud object storage configuration for backup archive export
                      type: object
                      required:
                        - bucket
                      properties:
                        endpoint:
                          type: string
                        bucket:
                          type: string
                          minLength: 1
                        region:
                          type: string
                        prefix:
                          type: string
                        clientImage:
                          description: Image providing the aws CLI for uploads and downloads (default amazon/aws-cli:2.37.4)
                          type: string
                        secretRef:
                          description: >-
                            Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY; without it the S3 client uses the
                            credentials of its environment (workload identity through serviceAccountName, instance profile)
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
                              minLength: 1
                networkPolicy:
                  description: NetworkPolicy configuration for database isolation
                  type: object
                  required:
                    - enabled
                  properties:
                    enabled:
                      description: Whether to enable NetworkPolicy for port 3050
                      type: boolean
                    ingressFrom:
                      type: array
                      items:
                        type: object
                        properties:
                          podSelector:
                            type: object
                            additionalProperties:
                              type: string
                          namespaceSelector:
                            type: object
                            additionalProperties:
                              type: string
                monitoring:
                  description: Monitoring configuration
                  type: object
                  properties:
                    enablePodMonitor:
                      description: Whether to enable Prometheus PodMonitor
                      type: boolean
                    enableGrafanaDashboard:
                      description: Whether to reconcile a Grafana dashboard ConfigMap
                      type: boolean
                    exporter:
                      description: Prometheus exporter sidecar configuration
                      type: object
                      required:
                        - enabled
                      properties:
                        enabled:
                          type: boolean
                        image:
                          type: string
                        port:
                          type: integer
                          minimum: 1024
                          maximum: 65535
                        resources:
                          type: object
                        env:
                          type: array
                          items:
                            type: object
                tls:
                  description: TLS / WireCrypt security configuration
                  type: object
                  required:
                    - enabled
                  properties:
                    enabled:
                      description: Whether TLS encryption is required for database connections
                      type: boolean
                    secretName:
                      description: Secret containing server TLS certificate and key
                      type: string
                    issuerRef:
                      description: cert-manager Issuer reference for automated TLS certificate issuance
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          minLength: 1
                        kind:
                          type: string
                        group:
                          type: string
                replication:
                  description: >
                    Journal-based asynchronous replication (Firebird 4.0+). Instance 0 is the
                    bootstrap primary; the other instances are read-only replicas seeded from a
                    ready replica or the primary's offline bootstrap seed. See ISSUES.md.
                  type: object
                  required:
                    - enabled
                  x-kubernetes-validations:
                    - rule: "!self.enabled || !has(self.mode) || self.mode == 'async'"
                      message: replication mode 'sync' is not supported yet; use 'async' (journal shipping)
                  properties:
                    enabled:
                      description: Whether replication is enabled
                      type: boolean
                    mode:
                      description: >
                        Replication mode. Only 'async' (journal shipping) is supported; 'sync' is
                        rejected until synchronous replication is implemented. Defaults to 'async'.
                      type: string
                      enum:
                        - sync
                        - async
                    journalDirectory:
                      description: >
                        Base directory for replication files on each instance's volume; journal,
                        archive and source directories are created below it. Must be below
                        /var/lib/firebird/data (defaults to "/var/lib/firebird/data/replication").
                      type: string
                      pattern: '^/var/lib/firebird/data/[A-Za-z0-9._/-]+$'
                    archiveTimeoutSeconds:
                      description: Seconds after which a partially filled journal segment is archived and shipped (defaults to 10)
                      type: integer
                      minimum: 1
                    segmentRetentionHours:
                      description: Hours archived segments are kept on the primary for replicas to fetch (defaults to 24)
                      type: integer
                      minimum: 1
                    maxSegmentRetentionHours:
                      description: >-
                        Hours archived segments a replica has not applied yet are kept past
                        segmentRetentionHours, so a slow or stopped replica can catch up without being
                        re-seeded (defaults to 168; never less than segmentRetentionHours)
                      type: integer
                      minimum: 1
                    failover:
                      description: >-
                        Automatic failover: when the primary pod has not been ready for delaySeconds,
                        the most advanced ready replica is promoted and the old primary is re-seeded.
                        Asynchronous replication: transactions the replicas had not received are lost.
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        delaySeconds:
                          description: Seconds the primary must be unavailable before a failover (default 30)
                          type: integer
                          minimum: 1
                    allowLiveSeedFromPrimary:
                      description: >
                        Allow seeding a replica with a locked copy of the live primary when no ready
                        replica and no usable offline bootstrap seed exist. Off by default: seeding
                        from replicas or the offline seed adds no load to the primary and avoids a
                        suspected commit/lock window (ISSUES.md, issue 2).
                      type: boolean
                    archiveSchedule:
                      description: Cron schedule for archiving completed journal files to object storage
                      type: string
                    readOnlyRouting:
                      description: >
                        Replication lag and readiness-aware routing of read-only traffic.
                        When enabled, the -replica Service only selects ready replicas whose
                        reported replication lag (pod annotation
                        firebird.cloudnative-firebird.io/replication-lag-seconds) is within
                        maxLagSeconds, and the primary Service only selects the primary pod.
                      type: object
                      required:
                        - enabled
                      properties:
                        enabled:
                          description: Whether lag-aware read-only routing is enabled
                          type: boolean
                        maxLagSeconds:
                          description: Maximum replication lag in seconds for a replica to receive read traffic (defaults to 30)
                          type: integer
                          minimum: 0
                        fallbackToPrimary:
                          description: Route read-only traffic to the primary when no replica is eligible (defaults to true)
                          type: boolean
                    journalArchiveS3:
                      description: Cloud S3 storage configuration for continuous journal archiving (PITR)
                      type: object
                      required:
                        - bucket
                      properties:
                        endpoint:
                          type: string
                        bucket:
                          type: string
                          minLength: 1
                        region:
                          type: string
                        prefix:
                          type: string
                        clientImage:
                          description: Image providing the aws CLI for uploads and downloads (default amazon/aws-cli:2.37.4)
                          type: string
                        secretRef:
                          description: >-
                            Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY; without it the S3 client uses the
                            credentials of its environment (workload identity through serviceAccountName, instance profile)
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
                              minLength: 1
                autoSweep:
                  description: AutoSweep configuration for periodic gfix database sweeping
                  type: object
                  required:
                    - enabled
                  properties:
                    enabled:
                      description: Whether database sweeping is enabled
                      type: boolean
                    schedule:
                      description: Cron schedule for sweep execution (defaults to "0 3 * * *")
                      type: string
                      pattern: '^\s*\S+(\s+\S+){4}\s*$'
                    databaseName:
                      description: Database file name to sweep (defaults to spec.databaseName)
                      type: string
                diagnostics:
                  description: Diagnostics configuration for online database integrity checks (gfix -v -full)
                  type: object
                  required:
                    - enabled
                  properties:
                    enabled:
                      description: Whether online database diagnostics are enabled
                      type: boolean
                    schedule:
                      description: Cron schedule for diagnostic execution (defaults to "0 4 * * 0")
                      type: string
                      pattern: '^\s*\S+(\s+\S+){4}\s*$'
                    databaseName:
                      description: Database file name to check (defaults to spec.databaseName)
                      type: string
                config:
                  description: Custom firebird.conf configuration settings
                  type: object
                  properties:
                    settings:
                      type: object
                      additionalProperties:
                        type: string
                      x-kubernetes-validations:
                        - rule: self.all(k, k.lowerAscii() != 'securitydatabase')
                          message: SecurityDatabase is managed by the operator (the security database is kept on the instance volume)
                bootstrap:
                  description: Bootstrap options for initial database creation
                  type: object
                  properties:
                    initSql:
                      description: Inline DDL/DML SQL script to run on initial database creation
                      type: string
                    recovery:
                      description: Cloud or file backup recovery configuration for database bootstrapping
                      type: object
                      x-kubernetes-validations:
                        - rule: has(self.s3) || (has(self.sourcePath) && self.sourcePath != '')
                          message: bootstrap recovery requires either sourcePath or s3
                      properties:
                        sourcePath:
                          description: >-
                            gbak backup to restore: the object key relative to s3.prefix (default
                            backup.fbk) when s3 is set, otherwise a file path readable from the
                            init container
                          type: string
                        s3:
                          type: object
                          required:
                            - bucket
                          properties:
                            endpoint:
                              type: string
                            bucket:
                              type: string
                              minLength: 1
                            region:
                              type: string
                            prefix:
                              type: string
                            clientImage:
                              description: Image providing the aws CLI for uploads and downloads (default amazon/aws-cli:2.37.4)
                              type: string
                            secretRef:
                              description: >-
                                Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY; without it the S3 client uses the
                                credentials of its environment (workload identity through serviceAccountName, instance profile)
                              type: object
                              required:
                                - name
                              properties:
                                name:
                                  type: string
                                  minLength: 1
                    clone:
                      description: Target source cluster configuration for cluster-to-cluster cloning
                      type: object
                      required:
                        - sourceCluster
                      properties:
                        sourceCluster:
                          type: string
                          minLength: 1
                        namespace:
                          type: string
                        databaseName:
                          description: Database file name in the source cluster (defaults to this cluster's databaseName)
                          type: string
                        superuserSecret:
                          description: Secret (key "password") in this namespace with the source cluster's SYSDBA password; defaults to superuserSecret
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
                env:
                  description: Additional environment variables for the Firebird container
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      valueFrom:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                nodeSelector:
                  description: Node labels required for pod scheduling
                  type: object
                  additionalProperties:
                    type: string
                affinity:
                  description: Pod affinity and anti-affinity rules
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                tolerations:
                  description: Node taint tolerations
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                podSecurityContext:
                  description: >-
                    Pod security context of the instance pods (a Kubernetes PodSecurityContext),
                    merged over the defaults fsGroup 999 and seccompProfile RuntimeDefault
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                securityContext:
                  description: >-
                    Security context of every instance container (a Kubernetes SecurityContext),
                    merged over the defaults: allowPrivilegeEscalation false, all capabilities
                    dropped except CHOWN, DAC_OVERRIDE and FOWNER (the official image runs the
                    server as root)
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                serviceAccountName:
                  description: >-
                    Existing ServiceAccount for the instance pods and every Job of the cluster
                    (backups, restores, journal archiving, maintenance), e.g. for S3 access through
                    workload identity instead of static keys. Defaults to the namespace's default
                    ServiceAccount.
                  type: string
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                serviceType:
                  description: Kubernetes Service type (ClusterIP, NodePort, LoadBalancer)
                  type: string
                  enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                suspended:
                  description: Whether reconciliation is suspended for this cluster
                  type: boolean
                hibernated:
                  description: >
                    Declarative hibernation. When true the StatefulSet is scaled to zero and
                    operator-managed CronJobs are suspended, while PVCs, Services and
                    configuration are retained. Set back to false to resume the cluster.
                  type: boolean
                primaryUpdateStrategy:
                  description: >
                    With replication, instance pods are updated by the operator, replicas first
                    and the primary last. unsupervised (default) updates the primary
                    automatically; supervised waits for a switchover (targetPrimary annotation)
                    or a manual restart of the primary.
                  type: string
                  enum: [unsupervised, supervised]
                primaryUpdateMethod:
                  description: >
                    How an unsupervised rolling update updates the primary: restart (default)
                    restarts it in place, switchover promotes an updated replica first.
                  type: string
                  enum: [restart, switchover]
                serviceAnnotations:
                  description: Custom annotations to apply to primary and replica services
                  type: object
                  additionalProperties:
                    type: string
            status:
              description: FirebirdClusterStatus defines the observed state of a FirebirdCluster
              type: object
              properties:
                instances:
                  description: Total number of configured instances
                  type: integer
                readyInstances:
                  description: Number of ready instances
                  type: integer
                phase:
                  description: Current phase of the cluster
                  type: string
                  enum:
                    - Creating
                    - Running
                    - Updating
                    - Degraded
                    - Deleting
                    - Paused
                    - Hibernated
                phaseReason:
                  description: Human-readable message about the current phase
                  type: string
                superuserSecretHash:
                  description: SHA-256 hash digest of superuser secret for password rotation tracking
                  type: string
                selector:
                  description: Label selector of the instance pods (scale subresource)
                  type: string
                fencedInstances:
                  description: Instances whose database is fenced (full shutdown), applied from the fencedInstances annotation
                  type: array
                  items:
                    type: string
                rollingUpdate:
                  description: Rolling update in progress (replication clusters, primary last)
                  type: object
                  properties:
                    revision:
                      description: StatefulSet revision the instances are updated to
                      type: string
                    outdatedInstances:
                      type: array
                      items:
                        type: string
                    message:
                      type: string
                    primaryRestart:
                      description: Primary pod restarted by the update (failover waits for it)
                      type: object
                      properties:
                        pod:
                          type: string
                        uid:
                          type: string
                        time:
                          type: string
                recreatingVolumes:
                  description: Replicas whose volume is being re-created (reseed=volume annotation)
                  type: array
                  items:
                    type: object
                    properties:
                      pod:
                        type: string
                      claimUid:
                        description: UID of the claim being replaced
                        type: string
                reseedingInstances:
                  description: Replicas being re-seeded (reseed pod annotation)
                  type: array
                  items:
                    type: string
                primaryNotReadySince:
                  description: Since when the primary pod has not been ready (automatic failover)
                  type: string
                switchover:
                  description: Planned switchover or automatic failover in progress, or the last one
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - switchover
                        - failover
                    target:
                      type: string
                    from:
                      type: string
                    phase:
                      type: string
                      enum:
                        - Electing
                        - Stopping
                        - Promoting
                        - Completed
                        - Failed
                    message:
                      type: string
                    startTime:
                      type: string
                    completionTime:
                      type: string
                    targetToken:
                      type: string
                    fromToken:
                      type: string
                    reseed:
                      description: Replicas that were not ready when the primary moved (pod UIDs), re-seeded
                      type: object
                      additionalProperties:
                        type: string
                replicationStatus:
                  description: Detailed replication status details
                  type: object
                  properties:
                    primaryPod:
                      type: string
                    activeReplicas:
                      type: integer
                    readRoutablePods:
                      description: Pods currently selected by the read-only -replica Service
                      type: array
                      items:
                        type: string
                    laggingReplicas:
                      description: Replicas excluded from read-only routing because of replication lag
                      type: array
                      items:
                        type: string
                    lastArchivedSequence:
                      description: Last journal segment archived on the primary
                      type: integer
                    replicas:
                      description: Replication position and lag of each ready replica, measured from the segment servers
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          appliedSequence:
                            description: Journal segment applied by the replica
                            type: integer
                          pendingSegments:
                            description: Segments received but not applied yet
                            type: integer
                          lagSegments:
                            description: Segments archived on the primary after the applied one
                            type: integer
                          lagSeconds:
                            description: Age of the oldest archived segment not applied yet (0 when up to date)
                            type: integer
                          error:
                            type: string
                    segmentRetention:
                      description: Archived segments the primary keeps for the replicas past segmentRetentionHours
                      type: object
                      properties:
                        floorSequence:
                          description: Lowest segment applied by a replica; every archived segment after it is kept
                          type: integer
                        replicas:
                          description: Last applied segment known for each replica, including replicas not ready now
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              appliedSequence:
                                type: integer
                volumes:
                  description: Per-instance PVC storage and volume expansion status
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - state
                    properties:
                      name:
                        type: string
                      requestedSize:
                        type: string
                      capacity:
                        type: string
                      state:
                        type: string
                        enum:
                          - Ready
                          - Resizing
                          - ResizeFailed
                          - ShrinkRejected
                      message:
                        type: string
                conditions:
                  description: List of status conditions
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
