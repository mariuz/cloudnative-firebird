apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firebirdclusters.firebird.cloudnative-firebird.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: firebird.cloudnative-firebird.io
  names:
    kind: FirebirdCluster
    listKind: FirebirdClusterList
    plural: firebirdclusters
    singular: firebirdcluster
    shortNames:
      - fb
      - fbc
    categories:
      - all
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.instances
          statusReplicasPath: .status.instances
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Instances
          type: integer
          jsonPath: .spec.instances
        - name: Ready
          type: integer
          jsonPath: .status.readyInstances
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Image
          type: string
          jsonPath: .spec.imageName
          priority: 1
      schema:
        openAPIV3Schema:
          description: FirebirdCluster is the Schema for the firebirdclusters API
          type: object
          required:
            - spec
          properties:
            apiVersion:
              description: >
                APIVersion defines the versioned schema of this representation of an object.
              type: string
            kind:
              description: Kind is a string value representing the REST resource this object represents.
              type: string
            metadata:
              type: object
            spec:
              description: FirebirdClusterSpec defines the desired state of a FirebirdCluster
              type: object
              required:
                - instances
                - storage
              properties:
                instances:
                  description: Number of Firebird instances to run in this cluster
                  type: integer
                  minimum: 1
                  maximum: 10
                imageName:
                  description: >
                    Full name of the Firebird Docker image to use.
                    Defaults to firebirdsql/firebird:latest
                  type: string
                superuserSecret:
                  description: Reference to the Secret containing the SYSDBA password
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      description: Name of the Secret resource
                      type: string
                storage:
                  description: Storage configuration for Firebird data files
                  type: object
                  required:
                    - size
                  properties:
                    size:
                      description: >
                        Size of the PersistentVolumeClaim (e.g. "1Gi"). Increasing this value
                        expands existing PVCs in place (requires a StorageClass with
                        allowVolumeExpansion); shrinking is not supported.
                      type: string
                    storageClass:
                      description: Optional StorageClass name for the PVC
                      type: string
                resources:
                  description: Resource requirements for each Firebird container
                  type: object
                  properties:
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                backup:
                  description: Backup configuration
                  type: object
                  required:
                    - enabled
                  properties:
                    enabled:
                      description: Whether backups are enabled
                      type: boolean
                    type:
                      description: Backup strategy ('logical' via gbak or 'physical' via nbackup)
                      type: string
                      enum:
                        - logical
                        - physical
                    level:
                      description: nbackup physical backup level (0 for full base backup, 1 or 2 for incremental)
                      type: integer
                      minimum: 0
                      maximum: 2
                    schedule:
                      description: Cron schedule for backups (e.g. "0 2 * * *")
                      type: string
                    retentionPolicy:
                      description: Backup retention policy (e.g. "7d")
                      type: string
                    s3:
                      description: Cloud object storage configuration for backup archive export
                      type: object
                      required:
                        - bucket
                        - secretRef
                      properties:
                        endpoint:
                          type: string
                        bucket:
                          type: string
                        region:
                          type: string
                        prefix:
                          type: string
                        secretRef:
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
                networkPolicy:
                  description: NetworkPolicy configuration for database isolation
                  type: object
                  required:
                    - enabled
                  properties:
                    enabled:
                      description: Whether to enable NetworkPolicy for port 3050
                      type: boolean
                    ingressFrom:
                      type: array
                      items:
                        type: object
                        properties:
                          podSelector:
                            type: object
                            additionalProperties:
                              type: string
                          namespaceSelector:
                            type: object
                            additionalProperties:
                              type: string
                monitoring:
                  description: Monitoring configuration
                  type: object
                  properties:
                    enablePodMonitor:
                      description: Whether to enable Prometheus PodMonitor
                      type: boolean
                    enableGrafanaDashboard:
                      description: Whether to reconcile a Grafana dashboard ConfigMap
                      type: boolean
                    exporter:
                      description: Prometheus exporter sidecar configuration
                      type: object
                      required:
                        - enabled
                      properties:
                        enabled:
                          type: boolean
                        image:
                          type: string
                        port:
                          type: integer
                          minimum: 1024
                          maximum: 65535
                        resources:
                          type: object
                        env:
                          type: array
                          items:
                            type: object
                tls:
                  description: TLS / WireCrypt security configuration
                  type: object
                  required:
                    - enabled
                  properties:
                    enabled:
                      description: Whether TLS encryption is required for database connections
                      type: boolean
                    secretName:
                      description: Secret containing server TLS certificate and key
                      type: string
                    issuerRef:
                      description: cert-manager Issuer reference for automated TLS certificate issuance
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                        kind:
                          type: string
                        group:
                          type: string
                replication:
                  description: Replication configuration (requires Firebird 4.0+)
                  type: object
                  required:
                    - enabled
                  properties:
                    enabled:
                      description: Whether replication is enabled
                      type: boolean
                    mode:
                      description: >
                        Replication mode. 'sync' waits for replica acknowledgement before
                        confirming writes (safer, slower). 'async' confirms writes immediately
                        and lets replicas catch up (faster, less durable). Defaults to 'async'.
                      type: string
                      enum:
                        - sync
                        - async
                    journalDirectory:
                      description: Directory path for replication journal files (defaults to "/firebird/data/journals")
                      type: string
                    archiveSchedule:
                      description: Cron schedule for archiving completed journal files to object storage
                      type: string
                    readOnlyRouting:
                      description: >
                        Replication lag and readiness-aware routing of read-only traffic.
                        When enabled, the -replica Service only selects ready replicas whose
                        reported replication lag (pod annotation
                        firebird.cloudnative-firebird.io/replication-lag-seconds) is within
                        maxLagSeconds, and the primary Service only selects the primary pod.
                      type: object
                      required:
                        - enabled
                      properties:
                        enabled:
                          description: Whether lag-aware read-only routing is enabled
                          type: boolean
                        maxLagSeconds:
                          description: Maximum replication lag in seconds for a replica to receive read traffic (defaults to 30)
                          type: integer
                          minimum: 0
                        fallbackToPrimary:
                          description: Route read-only traffic to the primary when no replica is eligible (defaults to true)
                          type: boolean
                    journalArchiveS3:
                      description: Cloud S3 storage configuration for continuous journal archiving (PITR)
                      type: object
                      required:
                        - bucket
                        - secretRef
                      properties:
                        endpoint:
                          type: string
                        bucket:
                          type: string
                        region:
                          type: string
                        prefix:
                          type: string
                        secretRef:
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
                autoSweep:
                  description: AutoSweep configuration for periodic gfix database sweeping
                  type: object
                  required:
                    - enabled
                  properties:
                    enabled:
                      description: Whether database sweeping is enabled
                      type: boolean
                    schedule:
                      description: Cron schedule for sweep execution (defaults to "0 3 * * *")
                      type: string
                    databaseName:
                      description: Database file name to sweep (defaults to "mydb.fdb")
                      type: string
                diagnostics:
                  description: Diagnostics configuration for online database integrity checks (gfix -v -full)
                  type: object
                  required:
                    - enabled
                  properties:
                    enabled:
                      description: Whether online database diagnostics are enabled
                      type: boolean
                    schedule:
                      description: Cron schedule for diagnostic execution (defaults to "0 4 * * 0")
                      type: string
                    databaseName:
                      description: Database file name to check (defaults to "mydb.fdb")
                      type: string
                config:
                  description: Custom firebird.conf configuration settings
                  type: object
                  properties:
                    settings:
                      type: object
                      additionalProperties:
                        type: string
                bootstrap:
                  description: Bootstrap options for initial database creation
                  type: object
                  properties:
                    initSql:
                      description: Inline DDL/DML SQL script to run on initial database creation
                      type: string
                    recovery:
                      description: Cloud or file backup recovery configuration for database bootstrapping
                      type: object
                      properties:
                        sourcePath:
                          type: string
                        s3:
                          type: object
                          required:
                            - bucket
                            - secretRef
                          properties:
                            endpoint:
                              type: string
                            bucket:
                              type: string
                            region:
                              type: string
                            prefix:
                              type: string
                            secretRef:
                              type: object
                              required:
                                - name
                              properties:
                                name:
                                  type: string
                    clone:
                      description: Target source cluster configuration for cluster-to-cluster cloning
                      type: object
                      required:
                        - sourceCluster
                      properties:
                        sourceCluster:
                          type: string
                        namespace:
                          type: string
                env:
                  description: Additional environment variables for the Firebird container
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      valueFrom:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                nodeSelector:
                  description: Node labels required for pod scheduling
                  type: object
                  additionalProperties:
                    type: string
                affinity:
                  description: Pod affinity and anti-affinity rules
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                tolerations:
                  description: Node taint tolerations
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                serviceType:
                  description: Kubernetes Service type (ClusterIP, NodePort, LoadBalancer)
                  type: string
                  enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                suspended:
                  description: Whether reconciliation is suspended for this cluster
                  type: boolean
                serviceAnnotations:
                  description: Custom annotations to apply to primary and replica services
                  type: object
                  additionalProperties:
                    type: string
            status:
              description: FirebirdClusterStatus defines the observed state of a FirebirdCluster
              type: object
              properties:
                instances:
                  description: Total number of configured instances
                  type: integer
                readyInstances:
                  description: Number of ready instances
                  type: integer
                phase:
                  description: Current phase of the cluster
                  type: string
                  enum:
                    - Creating
                    - Running
                    - Updating
                    - Degraded
                    - Deleting
                    - Paused
                phaseReason:
                  description: Human-readable message about the current phase
                  type: string
                superuserSecretHash:
                  description: SHA-256 hash digest of superuser secret for password rotation tracking
                  type: string
                replicationStatus:
                  description: Detailed replication status details
                  type: object
                  properties:
                    primaryPod:
                      type: string
                    activeReplicas:
                      type: integer
                    syncReplicas:
                      type: array
                      items:
                        type: string
                    readRoutablePods:
                      description: Pods currently selected by the read-only -replica Service
                      type: array
                      items:
                        type: string
                    laggingReplicas:
                      description: Replicas excluded from read-only routing because of replication lag
                      type: array
                      items:
                        type: string
                volumes:
                  description: Per-instance PVC storage and volume expansion status
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - state
                    properties:
                      name:
                        type: string
                      requestedSize:
                        type: string
                      capacity:
                        type: string
                      state:
                        type: string
                        enum:
                          - Ready
                          - Resizing
                          - ResizeFailed
                          - ShrinkRejected
                      message:
                        type: string
                conditions:
                  description: List of status conditions
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
