apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firebirdbackups.firebird.cloudnative-firebird.io
spec:
  group: firebird.cloudnative-firebird.io
  names:
    kind: FirebirdBackup
    listKind: FirebirdBackupList
    plural: firebirdbackups
    singular: firebirdbackup
    shortNames:
      - fbb
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .spec.clusterName
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Location
          type: string
          jsonPath: .status.location
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: FirebirdBackup is the Schema for the firebirdbackups API
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: FirebirdBackupSpec defines the desired state of a FirebirdBackup
              type: object
              x-kubernetes-validations:
                - rule: "!has(self.type) || self.type != 'physical' || !has(self.s3)"
                  message: physical backups are stored in the primary's data directory; S3 upload is supported for logical backups only
              required:
                - clusterName
              properties:
                clusterName:
                  description: Target FirebirdCluster name (immutable)
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: clusterName is immutable
                type:
                  description: Backup type ('logical' or 'physical')
                  type: string
                  enum:
                    - logical
                    - physical
                level:
                  description: Physical backup level (0, 1, 2)
                  type: integer
                  minimum: 0
                  maximum: 2
                target:
                  description: >-
                    Where the backup runs: primary (default) or prefer-standby, a ready, unfenced and
                    non-lagging replica when one exists (logical backups to S3 only; others use the primary)
                  type: string
                  enum: [primary, prefer-standby]
                s3:
                  description: Upload the backup to S3 instead of the primary's data directory (logical backups only)
                  type: object
                  required:
                    - bucket
                  properties:
                    endpoint:
                      type: string
                    bucket:
                      type: string
                      minLength: 1
                    region:
                      type: string
                    prefix:
                      type: string
                    clientImage:
                      description: Image providing the aws CLI for uploads and downloads (default amazon/aws-cli:2.37.4)
                      type: string
                    secretRef:
                      description: >-
                        Secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY; without it the S3 client uses the
                        credentials of its environment (workload identity through serviceAccountName, instance profile)
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          minLength: 1
            status:
              description: FirebirdBackupStatus defines the observed state of FirebirdBackup
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                backupFileName:
                  description: Backup file name (in the primary's data directory, or the object key relative to s3.prefix)
                  type: string
                location:
                  description: Full location of the backup, a path on the primary or an s3:// URI
                  type: string
                instance:
                  description: Instance the backup was taken from
                  type: string
                jobName:
                  type: string
                error:
                  type: string
