apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firebirdrestores.firebird.cloudnative-firebird.io
spec:
  group: firebird.cloudnative-firebird.io
  names:
    kind: FirebirdRestore
    listKind: FirebirdRestoreList
    plural: firebirdrestores
    singular: firebirdrestore
    shortNames:
      - fbr
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .spec.clusterName
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: FirebirdRestore is the Schema for the firebirdrestores API
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: FirebirdRestoreSpec defines the desired state of a FirebirdRestore
              type: object
              required:
                - clusterName
              properties:
                clusterName:
                  description: Target FirebirdCluster name to restore into
                  type: string
                backupName:
                  description: FirebirdBackup custom resource name
                  type: string
                backupPath:
                  description: Direct path to backup file
                  type: string
                restoreType:
                  description: Restore strategy ('logical' or 'physical')
                  type: string
                  enum:
                    - logical
                    - physical
                targetDatabase:
                  description: Target database file name
                  type: string
                s3:
                  type: object
                  required:
                    - bucket
                    - secretRef
                  properties:
                    endpoint:
                      type: string
                    bucket:
                      type: string
                    region:
                      type: string
                    prefix:
                      type: string
                    secretRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
            status:
              description: FirebirdRestoreStatus defines the observed state of FirebirdRestore
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Restoring
                    - Completed
                    - Failed
                completionTime:
                  type: string
                  format: date-time
                error:
                  type: string
