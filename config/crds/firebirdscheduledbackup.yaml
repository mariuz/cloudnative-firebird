apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firebirdscheduledbackups.firebird.cloudnative-firebird.io
spec:
  group: firebird.cloudnative-firebird.io
  names:
    kind: FirebirdScheduledBackup
    listKind: FirebirdScheduledBackupList
    plural: firebirdscheduledbackups
    singular: firebirdscheduledbackup
    shortNames:
      - fsb
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .spec.clusterName
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Suspend
          type: boolean
          jsonPath: .spec.suspend
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: FirebirdScheduledBackup is the Schema for the firebirdscheduledbackups API
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: FirebirdScheduledBackupSpec defines the desired state of a FirebirdScheduledBackup
              type: object
              required:
                - clusterName
                - schedule
              properties:
                clusterName:
                  description: Target FirebirdCluster name
                  type: string
                schedule:
                  description: Cron schedule expression (e.g. "0 2 * * *")
                  type: string
                suspend:
                  description: Whether scheduled backup execution is suspended
                  type: boolean
                type:
                  description: Backup type ('logical' or 'physical')
                  type: string
                  enum:
                    - logical
                    - physical
                level:
                  description: Physical backup level (0, 1, 2)
                  type: integer
                  minimum: 0
                  maximum: 2
                retentionPolicy:
                  description: Backup retention policy (e.g. "7d")
                  type: string
                s3:
                  type: object
                  required:
                    - bucket
                    - secretRef
                  properties:
                    endpoint:
                      type: string
                    bucket:
                      type: string
                    region:
                      type: string
                    prefix:
                      type: string
                    secretRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
            status:
              description: FirebirdScheduledBackupStatus defines the observed state of FirebirdScheduledBackup
              type: object
              properties:
                lastScheduleTime:
                  type: string
                  format: date-time
                lastSuccessfulTime:
                  type: string
                  format: date-time
                backupCount:
                  type: integer
